# Ansible Configuration for Mantl Platform
# Compatible with Ansible 13.x (ansible-core 2.17+)
# Updated: 2025-12-27

[defaults]
# Connection Settings
host_key_checking = False
record_host_keys = False
ssh_args = -o ControlMaster=auto -o ControlPersist=30m -o ServerAliveInterval=60

# Python Interpreter Discovery
interpreter_python = auto_silent
action_warnings = False
deprecation_warnings = True

# Performance
forks = 1000
gathering = smart
gather_subset = !hardware,!facter,!ohai
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 3600

# Paths
inventory = inventory
roles_path = roles:~/.ansible/roles:/usr/share/ansible/roles
collections_path = collections:~/.ansible/collections:/usr/share/ansible/collections
callback_plugins = plugins/callbacks
retry_files_enabled = False

# Output
stdout_callback = yaml
bin_ansible_callbacks = True
ansible_managed = Ansible managed: modified on %Y-%m-%d %H:%M:%S by {uid} on {host}
display_skipped_hosts = False
display_ok_hosts = True

# Security
no_log = False
no_target_syslog = False

# Privilege Escalation
become = False
become_method = sudo
become_user = root
become_ask_pass = False

[inventory]
# Inventory plugin settings
enable_plugins = host_list, script, auto, yaml, ini, toml

[privilege_escalation]
become = False
become_method = sudo
become_user = root
become_ask_pass = False

[paramiko_connection]
record_host_keys = False

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=30m -o ServerAliveInterval=60
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
scp_if_ssh = smart

[persistent_connection]
connect_timeout = 30
command_timeout = 30

[galaxy]
# Ansible Galaxy settings
server_list = release_galaxy

[galaxy_server.release_galaxy]
url = https://galaxy.ansible.com/
