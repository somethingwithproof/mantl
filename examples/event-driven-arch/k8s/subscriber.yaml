apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-subscriber
  namespace: event-driven
  labels:
    app: event-subscriber
spec:
  replicas: 3  # Multiple replicas for consumer group
  selector:
    matchLabels:
      app: event-subscriber
  template:
    metadata:
      labels:
        app: event-subscriber
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9090'
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: subscriber
          image: REGISTRY/event-subscriber:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9090
          env:
            - name: NATS_URL
              value: nats://nats:4222
            - name: STREAM_NAME
              value: EVENTS
            - name: CONSUMER_NAME
              value: order-processor
            - name: DURABLE_NAME
              value: order-processor-durable
            - name: FILTER_SUBJECT
              value: EVENTS.order_*
            - name: METRICS_PORT
              value: '9090'
          resources:
            requests:
              ephemeral-storage: 64Mi
              cpu: 200m
              memory: 256Mi
            limits:
              ephemeral-storage: 256Mi
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      # Graceful shutdown: allow 30 seconds for message ack
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: event-subscriber
  namespace: event-driven
  labels:
    app: event-subscriber
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    app: event-subscriber
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: event-subscriber
  namespace: event-driven
spec:
  podSelector:
    matchLabels:
      app: event-subscriber
  policyTypes:
    - Egress
  egress:
    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # Allow NATS
    - to:
        - podSelector:
            matchLabels:
              app: nats
      ports:
        - protocol: TCP
          port: 4222
    # Allow external APIs (customize as needed)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: event-subscriber
  namespace: event-driven
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: event-subscriber
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Scale based on queue depth
    - type: Pods
      pods:
        metric:
          name: event_queue_depth
        target:
          type: AverageValue
          averageValue: '100'
