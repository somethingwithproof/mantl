apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-publisher
  namespace: event-driven
  labels:
    app: event-publisher
spec:
  replicas: 2
  selector:
    matchLabels:
      app: event-publisher
  template:
    metadata:
      labels:
        app: event-publisher
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8000'
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: publisher
          image: REGISTRY/event-publisher:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: NATS_URL
              value: nats://nats:4222
            - name: STREAM_NAME
              value: EVENTS
          resources:
            requests:
              ephemeral-storage: 64Mi
              cpu: 200m
              memory: 256Mi
            limits:
              ephemeral-storage: 256Mi
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: event-publisher
  namespace: event-driven
  labels:
    app: event-publisher
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: event-publisher
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: event-publisher
  namespace: event-driven
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: '100'
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - events.example.com
      secretName: event-publisher-tls
  rules:
    - host: events.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: event-publisher
                port:
                  number: 8000
