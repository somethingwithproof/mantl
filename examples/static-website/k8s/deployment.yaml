apiVersion: v1
kind: Namespace
metadata:
  name: static-sites
  labels:
    purpose: static-website-hosting
    platform: mantl
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mantl-website
  namespace: static-sites
  labels:
    app: mantl-website
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mantl-website
  template:
    metadata:
      labels:
        app: mantl-website
      annotations:
        prometheus.io/scrape: 'false'
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101  # nginx user
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: REGISTRY/mantl-website:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              ephemeral-storage: 64Mi
              cpu: 50m
              memory: 64Mi
            limits:
              ephemeral-storage: 256Mi
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: mantl-website
  namespace: static-sites
  labels:
    app: mantl-website
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: mantl-website
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mantl-website
  namespace: static-sites
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # CDN integration annotations (CloudFront example)
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # Enable CDN caching
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Cache-Control: public, max-age=300";
      more_set_headers "X-CDN-Cache: $upstream_cache_status";
    # Enable compression
    nginx.ingress.kubernetes.io/enable-brotli: 'true'
    nginx.ingress.kubernetes.io/brotli-level: '6'
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - mantl.example.com
        - www.mantl.example.com
      secretName: mantl-website-tls
  rules:
    - host: mantl.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mantl-website
                port:
                  number: 80
    - host: www.mantl.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mantl-website
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mantl-website
  namespace: static-sites
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mantl-website
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mantl-website
  namespace: static-sites
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: mantl-website
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mantl-website
  namespace: static-sites
spec:
  podSelector:
    matchLabels:
      app: mantl-website
  policyTypes:
    - Ingress
  ingress:
    # Allow from ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
