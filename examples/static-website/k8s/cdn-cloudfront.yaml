# CloudFront CDN Configuration (AWS)
# This is a reference configuration for setting up CloudFront CDN
# Apply using AWS CLI or Terraform

# Create CloudFront distribution
# aws cloudfront create-distribution --distribution-config file://cloudfront-config.json

cloudfront-config.json:
  {
    "CallerReference": "mantl-website-2024",
    "Comment": "Mantl Platform Static Website CDN",
    "Enabled": true,
    "Origins": {
      "Quantity": 1,
      "Items": [
        {
          "Id": "mantl-k8s-origin",
          "DomainName": "mantl.example.com",
          "CustomOriginConfig": {
            "HTTPPort": 80,
            "HTTPSPort": 443,
            "OriginProtocolPolicy": "https-only",
            "OriginSslProtocols": {
              "Quantity": 1,
              "Items": ["TLSv1.2"]
            },
            "OriginReadTimeout": 30,
            "OriginKeepaliveTimeout": 5
          },
          "ConnectionAttempts": 3,
          "ConnectionTimeout": 10,
          "OriginShield": {
            "Enabled": true,
            "OriginShieldRegion": "us-east-1"
          }
        }
      ]
    },
    "DefaultCacheBehavior": {
      "TargetOriginId": "mantl-k8s-origin",
      "ViewerProtocolPolicy": "redirect-to-https",
      "AllowedMethods": {
        "Quantity": 2,
        "Items": ["GET", "HEAD"],
        "CachedMethods": {
          "Quantity": 2,
          "Items": ["GET", "HEAD"]
        }
      },
      "Compress": true,
      "CachePolicyId": "658327ea-f89d-4fab-a63d-7e88639e58f6",  # CachingOptimized
      "OriginRequestPolicyId": "88a5eaf4-2fd4-4709-b370-b4c650ea3fcf",  # CORS-CustomOrigin
      "ResponseHeadersPolicyId": "5cc3b908-e619-4b99-88e5-2cf7f45965bd"  # SecurityHeadersPolicy
    },
    "CacheBehaviors": {
      "Quantity": 2,
      "Items": [
        {
          "PathPattern": "*.html",
          "TargetOriginId": "mantl-k8s-origin",
          "ViewerProtocolPolicy": "redirect-to-https",
          "DefaultTTL": 300,
          "MinTTL": 0,
          "MaxTTL": 3600,
          "Compress": true
        },
        {
          "PathPattern": "/api/*",
          "TargetOriginId": "mantl-k8s-origin",
          "ViewerProtocolPolicy": "redirect-to-https",
          "AllowedMethods": {
            "Quantity": 7,
            "Items": ["GET", "HEAD", "OPTIONS", "PUT", "POST", "PATCH", "DELETE"]
          },
          "DefaultTTL": 0,
          "MinTTL": 0,
          "MaxTTL": 0,
          "Compress": false
        }
      ]
    },
    "CustomErrorResponses": {
      "Quantity": 2,
      "Items": [
        {
          "ErrorCode": 404,
          "ResponsePagePath": "/404.html",
          "ResponseCode": "404",
          "ErrorCachingMinTTL": 300
        },
        {
          "ErrorCode": 403,
          "ResponsePagePath": "/index.html",
          "ResponseCode": "200",
          "ErrorCachingMinTTL": 0
        }
      ]
    },
    "Aliases": {
      "Quantity": 2,
      "Items": ["mantl.example.com", "www.mantl.example.com"]
    },
    "ViewerCertificate": {
      "ACMCertificateArn": "arn:aws:acm:us-east-1:ACCOUNT_ID:certificate/CERT_ID",
      "SSLSupportMethod": "sni-only",
      "MinimumProtocolVersion": "TLSv1.2_2021"
    },
    "PriceClass": "PriceClass_100",  # US, Canada, Europe
    "HttpVersion": "http2and3",
    "IsIPV6Enabled": true,
    "Logging": {
      "Enabled": true,
      "IncludeCookies": false,
      "Bucket": "mantl-cdn-logs.s3.amazonaws.com",
      "Prefix": "cloudfront/"
    }
  }

# Create using AWS CLI:
# aws cloudfront create-distribution --distribution-config file://cloudfront-config.json

# Update Route53 to point to CloudFront
# aws route53 change-resource-record-sets --hosted-zone-id ZONE_ID --change-batch file://route53-changes.json

route53-changes.json:
  {
    "Changes": [
      {
        "Action": "UPSERT",
        "ResourceRecordSet": {
          "Name": "mantl.example.com",
          "Type": "A",
          "AliasTarget": {
            "HostedZoneId": "Z2FDTNDATAQYW2",
            "DNSName": "d1234567890.cloudfront.net",
            "EvaluateTargetHealth": false
          }
        }
      },
      {
        "Action": "UPSERT",
        "ResourceRecordSet": {
          "Name": "www.mantl.example.com",
          "Type": "A",
          "AliasTarget": {
            "HostedZoneId": "Z2FDTNDATAQYW2",
            "DNSName": "d1234567890.cloudfront.net",
            "EvaluateTargetHealth": false
          }
        }
      }
    ]
  }
