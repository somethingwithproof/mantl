apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Inherit base cluster apps explicitly to avoid parent-cycle issues
  - ../../apps/cert-manager.yaml
  - ../../apps/cert-manager-clusterissuers.yaml
  - ../../apps/kyverno.yaml
  - ../../apps/kyverno-policies.yaml
  - ../../apps/prometheus.yaml
  # AWS-specific/extra apps
  - ../../../production/apps/cert-manager-issuer-dns-route53.yaml
  - ../../../production/apps/external-dns-aws.yaml
  - ../../../production/apps/gateway-sample.yaml
  - ../../../production/apps/example-hello.yaml
