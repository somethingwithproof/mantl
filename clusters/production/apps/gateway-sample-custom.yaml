apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-sample-custom
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_ORG/mantl.git
    targetRevision: HEAD
    path: clusters/production/gateway-sample-custom
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
}