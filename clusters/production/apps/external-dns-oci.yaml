apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns-oci
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    chart: external-dns
    targetRevision: 1.19.0
    helm:
      values: |
        provider: oci
        policy: upsert-only
        registry: txt
        txtOwnerId: mantl-prod
        domainFilters:
          - example.com  # Replace with your OCI DNS zone
        extraArgs:
          - --oci-compartment-ocid=ocid1.compartment.oc1..aaa...  # Replace with your compartment OCID
          - --oci-auth-instance-principal  # Use instance principal authentication
        # Alternative: Use API key authentication
        # env:
        #   - name: OCI_TENANCY_OCID
        #     valueFrom:
        #       secretKeyRef:
        #         name: oci-credentials
        #         key: tenancy_ocid
        #   - name: OCI_USER_OCID
        #     valueFrom:
        #       secretKeyRef:
        #         name: oci-credentials
        #         key: user_ocid
        #   - name: OCI_FINGERPRINT
        #     valueFrom:
        #       secretKeyRef:
        #         name: oci-credentials
        #         key: fingerprint
        #   - name: OCI_PRIVATE_KEY
        #     valueFrom:
        #       secretKeyRef:
        #         name: oci-credentials
        #         key: private_key
        #   - name: OCI_REGION
        #     value: us-ashburn-1
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
