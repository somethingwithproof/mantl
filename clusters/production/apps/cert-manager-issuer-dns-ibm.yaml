apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-issuer-dns-ibm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/thomasvincent/mantl.git
    targetRevision: HEAD
    path: platform/base/cert-manager/acme/ibm
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
