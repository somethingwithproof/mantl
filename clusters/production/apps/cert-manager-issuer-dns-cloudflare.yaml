apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-issuer-dns-cloudflare
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_ORG/mantl.git
    targetRevision: HEAD
    path: platform/base/cert-manager/acme/cloudflare
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
