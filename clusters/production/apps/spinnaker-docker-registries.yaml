apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spinnaker-docker-registries
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_ORG/mantl.git
    targetRevision: HEAD
    path: addons/spinnaker/overlays/docker-registries
  destination:
    server: https://kubernetes.default.svc
    namespace: spinnaker
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
}