apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: example-hello
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_ORG/mantl.git
    targetRevision: HEAD
    path: apps/examples/hello
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
