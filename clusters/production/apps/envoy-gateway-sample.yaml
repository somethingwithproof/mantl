apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway-sample
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_ORG/mantl.git
    targetRevision: HEAD
    path: platform/ingress/gateway-api/envoy-sample
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
}