# SPDX-License-Identifier: Apache-2.0
name: PCI-DSS
version: "4.0"
controls:
  - id: 1.2.1
    description: "Restricts inbound and outbound traffic to that which is necessary."
    policies:
      - default-deny-all-ingress
      - restrict-host-ports
    evidenceResources:
      - kind: networkpolicies
        namespace: ""
  - id: 2.2.1
    description: "Implement only necessary services, protocols, and functions."
    policies:
      - disallow-privileged-containers
      - restrict-service-types
    evidenceResources:
      - kind: pods
        namespace: ""
      - kind: services
        namespace: ""
