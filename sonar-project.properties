sonar.organization=somethingwithproof
sonar.projectKey=somethingwithproof_mantl

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,tests/**/*.py

# Vendored upstream Helm charts and other generated/external trees are not analyzed.
sonar.exclusions=platform/**,policies/kyverno/charts/**,vendor/**,**/*_test.go,tests/**/*.py,**/zz_generated.*.go,**/testdata/**,dist/**,bin/**,**/.terraform/**,**/.venv/**,**/venv/**
sonar.test.exclusions=platform/**,policies/kyverno/charts/**,vendor/**,**/.venv/**,**/venv/**
sonar.coverage.exclusions=**/*_test.go,tests/**/*.py,**/zz_generated.*.go,**/testdata/**

sonar.go.coverage.reportPaths=coverage.out
sonar.python.coverage.reportPaths=coverage-python.xml
sonar.python.version=3.12

# Scanner success requires the server to finish analysis and accept the gate.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

sonar.sourceEncoding=UTF-8
