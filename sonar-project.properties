sonar.organization=thomasvincent
sonar.projectKey=thomasvincent_mantl

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Vendored upstream Helm charts and other generated/external trees are not analyzed.
sonar.exclusions=platform/**,vendor/**,**/*_test.go,**/testdata/**,dist/**,bin/**
sonar.coverage.exclusions=**/*_test.go,**/testdata/**

sonar.go.coverage.reportPaths=coverage.out

sonar.sourceEncoding=UTF-8
