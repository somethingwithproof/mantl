name: pre-commit

on:
  pull_request:
  push:
    branches: [ main, "reorg/*", "feature/**" ]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
