---
# yamllint disable rule:line-length
name: pre-commit
'on':
  workflow_call:
    inputs:
      base-ref:
        type: string
        default: ''
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: pre-commit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  run:
    runs-on: ${{ vars.DO_RUNNERS_ENABLED == 'true' && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","Linux","X64","mantl-do"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: python go terraform tflint terraform-docs trivy pre-commit actionlint shellcheck
      - name: Validate all workflow definitions
        run: mise exec -- actionlint
      - name: Cache hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-${{ runner.arch }}-hooks-${{ hashFiles('.pre-commit-config.yaml', 'mise.toml') }}
      - name: Check changed files
        env:
          BASE: ${{ inputs.base-ref || github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then
            BASE=$(git rev-parse "$HEAD^")
          fi
          mise exec -- pre-commit run --from-ref "$BASE" --to-ref "$HEAD" --show-diff-on-failure
    timeout-minutes: 20
    name: Repository checks
