name: pre-commit

on:
  pull_request:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Need the base commit to diff against for changed-files scoping.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          # A hook pins python3.13 for its venv; the runner must provide it.
          python-version: '3.13'
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492
        with:
          version: '2026.10.2'
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
      # Lint only the files changed in the PR. The repo carries pre-existing
      # lint/format debt; gating new changes keeps the bar without a blocking
      # whole-repo cleanup (tracked separately).
      - name: Run pre-commit on changed files
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: >-
            --from-ref ${{ github.event.pull_request.base.sha }}
            --to-ref ${{ github.event.pull_request.head.sha }}
