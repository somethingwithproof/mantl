name: Code scanning issues

on:
  code_scanning_alert:
    types: [created, reopened]

permissions:
  contents: read
  issues: write

jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create issue for alert
        uses: actions/github-script@v7
        with:
          script: |
            const alert = context.payload.alert;
            const tool = (alert.tool?.name || 'code-scanning').toLowerCase();
            const rule = alert.rule?.id || 'unknown-rule';
            const sev = (alert.rule?.severity || alert.most_severe_rule?.severity || 'unknown').toLowerCase();
            const url = alert.html_url || `https://github.com/${context.repo.owner}/${context.repo.repo}/security/code-scanning`;
            const loc = alert.location?.path || alert.instances?.[0]?.location?.path || 'n/a';
            const title = `[${tool}] ${sev}: ${rule}`;
            const labels = [
              'security',
              'code-scanning',
              `tool: ${tool}`,
              `severity: ${sev}`,
              'created-by: automation'
            ];
            const body = `A new code scanning alert was detected.\n\n- Tool: ${tool}\n- Rule: ${rule}\n- Severity: ${sev}\n- Location: ${loc}\n- Alert: ${url}`;

            // Create the issue first, then try to assign the repo owner (if assignable).
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels,
            });

            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                assignees: [context.repo.owner],
              });
            } catch (e) {
              core.info(`Assignee add failed (likely org owner): ${e.message}`);
            }
