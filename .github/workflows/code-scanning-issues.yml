name: Code scanning issues

on:
  code_scanning_alert:
    types: [created, reopened]

permissions:
  contents: read
  issues: write

jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create issue for alert
        uses: actions/github-script@v7
        with:
          script: |
            const alert = context.payload.alert;
            const tool = alert.tool?.name || 'code-scanning';
            const rule = alert.rule?.id || 'unknown-rule';
            const severity = alert.rule?.severity || alert.most_severe_rule?.severity || 'unknown';
            const url = alert.html_url || `https://github.com/${context.repo.owner}/${context.repo.repo}/security/code-scanning`;
            const title = `[${tool}] ${severity}: ${rule}`;
            const body = `A new code scanning alert was detected.\n\n- Tool: ${tool}\n- Rule: ${rule}\n- Severity: ${severity}\n- Location: ${alert.location?.path || 'n/a'}\n- Alert: ${url}`;
            const labels = ['security', 'code-scanning'];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels,
            });
