# SPDX-License-Identifier: Apache-2.0
---
# yamllint disable rule:line-length
name: release-please
'on':
  push:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: release-please-main
  cancel-in-progress: false
jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Require protected main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: python
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Dispatch preflight only when the release PR has no eligible CI run
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ fromJSON(steps.release.outputs.pr || '{}').number }}
        run: mise exec -- python -m ci.release_pr_preflight
    timeout-minutes: 15
  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
