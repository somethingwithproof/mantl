# SPDX-License-Identifier: Apache-2.0
---
# yamllint disable rule:line-length
name: Nightly local acceptance
'on':
  schedule:
    - cron: 13 6 * * *
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  runtime:
    name: Disposable integration and packages
    uses: ./.github/workflows/compliance-runtime.yml
  benchmarks:
    name: Go benchmarks
    runs-on: ${{ vars.DO_RUNNERS_ENABLED == 'true' && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","Linux","X64","mantl-do"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: go
      - name: Run benchmarks without cluster dependencies
        run: |
          mise exec -- go test -run='^$' -bench=. -benchmem ./pkg/... | tee benchmarks.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: go-benchmarks
          path: benchmarks.txt
          if-no-files-found: error
          retention-days: 14
