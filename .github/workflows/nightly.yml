---
# yamllint disable rule:line-length
name: Nightly local acceptance
'on':
  schedule:
    - cron: 13 6 * * *
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  runtime:
    name: Disposable integration and packages
    uses: ./.github/workflows/compliance-runtime.yml
  benchmarks:
    name: Go benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: go
      - name: Run benchmarks without cluster dependencies
        run: |
          mise exec -- go test -run='^$' -bench=. -benchmem ./pkg/... | tee benchmarks.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: go-benchmarks
          path: benchmarks.txt
          if-no-files-found: error
          retention-days: 14
