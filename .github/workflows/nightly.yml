name: Nightly CI

on:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC
  workflow_dispatch:

jobs:
  nightly-full:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: mantl-dev:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pytest
        run: docker run --rm -v "$PWD":/workspace -w /workspace mantl-dev:ci pytest -v tests

      - name: Validate Kustomize (full)
        run: |
          chmod +x ci/validate-kustomize.sh
          docker run --rm -v "$PWD":/workspace -w /workspace mantl-dev:ci ./ci/validate-kustomize.sh

      - name: Validate Terraform
        run: docker run --rm -v "$PWD":/workspace -w /workspace mantl-dev:ci ./ci/validate-terraform.sh

      - name: Kubeconform production manifests
        run: |
          docker run --rm -v "$PWD":/project -w /project ghcr.io/yannh/kubeconform:latest \
            -strict -ignore-missing-schemas -summary <(docker run --rm -v "$PWD":/workspace -w /workspace mantl-dev:ci kustomize build clusters/production)

      - name: Kyverno validate production manifests
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace mantl-dev:ci sh -lc "kustomize build clusters/production > rendered.yaml && \
            docker run --rm -v \"$PWD\":/project -w /project ghcr.io/kyverno/kyverno:v1.12.1 \
            kyverno apply policies/kyverno --resource rendered.yaml --policy-report --skip-background-request"

      - name: Slack notify (always)
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then \
            STATUS="Nightly status: $GITHUB_WORKFLOW (#$GITHUB_RUN_NUMBER) on $GITHUB_REF => $GITHUB_JOB"; \
            curl -X POST -H 'Content-type: application/json' --data "{\"text\": \"$STATUS\nRepo: $GITHUB_REPOSITORY\nRun: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" "$SLACK_WEBHOOK_URL"; \
          else \
            echo "SLACK_WEBHOOK_URL not set; skipping"; \
          fi
