name: Terraform Validation

on:
  pull_request:
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform-validate.yml'
  push:
    branches:
      - main
    paths:
      - 'infra/terraform/**'

jobs:
  validate-providers:
    name: Validate ${{ matrix.provider }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        provider:
          - aws-eks
          - gcp-gke
          - azure-aks
          - do-doks
          - linode-lke
          - oci-oke
          - ibm-iks
          - openstack
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.10.0

      - name: Terraform Format Check
        working-directory: infra/terraform/blueprints/${{ matrix.provider }}
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: infra/terraform/blueprints/${{ matrix.provider }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: infra/terraform/blueprints/${{ matrix.provider }}
        run: terraform validate

      - name: Validate Required Files
        working-directory: infra/terraform/blueprints/${{ matrix.provider }}
        run: |
          if [ ! -f "main.tf" ]; then
            echo "main.tf not found"
            exit 1
          fi
          if [ ! -f "variables.tf" ]; then
            echo "variables.tf not found"
            exit 1
          fi


  validate-modules:
    name: Validate Terraform Modules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.10.0

      - name: Terraform Format Check (Modules)
        working-directory: infra/terraform/modules
        run: terraform fmt -check -recursive

      - name: Validate Platform Security Module
        working-directory: infra/terraform/modules/platform-security
        run: |
          terraform init -backend=false
          terraform validate

  tflint:
    name: TFLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest

      - name: Run TFLint
        run: |
          tflint --init
          tflint --recursive --format compact infra/terraform/

  checkov:
    name: Checkov Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform/
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,checkov-results.sarif
          soft_fail: true

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: checkov-results.sarif

  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs:
      - validate-providers
      - validate-modules
      - tflint
      - checkov
    if: always()

    steps:
      - name: Check Results
        run: |
          if [ "${{ needs.validate-providers.result }}" != "success" ] || \
             [ "${{ needs.validate-modules.result }}" != "success" ] || \
             [ "${{ needs.tflint.result }}" != "success" ]; then
            echo "Some validation checks failed"
            exit 1
          fi
          echo "All validation checks passed ✅"
