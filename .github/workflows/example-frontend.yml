---
# yamllint disable rule:line-length
name: Example frontend
'on':
  workflow_call: {}
  workflow_dispatch: {}
  schedule:
    - cron: 23 3 * * 2
permissions:
  contents: read
concurrency:
  group: example-frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/ecommerce-microservices/src/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.10.2
          working_directory: examples/ecommerce-microservices/src/frontend
          install_args: node
      - name: Cache locked npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('examples/ecommerce-microservices/src/frontend/package-lock.json')
            }}
      - name: Install locked dependencies
        run: mise exec -- npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit dependencies
        run: mise exec -- npm audit --audit-level=low
      - name: Test dev server, API proxy, and public URL configuration
        run: mise exec -- npm test
      - name: Type check and build
        run: mise exec -- npm run build
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build cached frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: examples/ecommerce-microservices/src/frontend
          tags: mantl-frontend:ci
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: Build and smoke-test production image
        shell: bash
        run: |
          set -euo pipefail
          container=$(docker run --detach --rm \
            --add-host products-api:127.0.0.1 --add-host orders-api:127.0.0.1 \
            --publish 127.0.0.1::8080 mantl-frontend:ci)
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
          address=$(docker port "$container" 8080/tcp)
          curl --fail --max-time 2 --retry 10 --retry-all-errors --retry-delay 1 --retry-max-time 30 "http://$address/health"
          curl --fail "http://$address/" --output /tmp/frontend-index.html
          grep -q 'assets/index-' /tmp/frontend-index.html
          test "$(docker inspect --format '{{.Config.User}}' "$container")" = nginx
