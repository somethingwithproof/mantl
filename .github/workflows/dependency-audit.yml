---
# yamllint disable rule:line-length
name: Dependency audit
'on':
  schedule:
    - cron: 29 7 * * 1
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: dependency-audit
  cancel-in-progress: false
jobs:
  python:
    name: Python dependency audit
    runs-on: ${{ vars.DO_RUNNERS_ENABLED == 'true' && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","Linux","X64","mantl-do"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: python
      - name: Audit pinned requirements
        run: |
          mise exec -- python -m venv .venv-audit
          mise exec -- .venv-audit/bin/python -m pip install pip-audit==2.10.1
          mise exec -- .venv-audit/bin/python -m pip_audit -r requirements.txt -r requirements-test.txt --format json --output dependency-audit.json
      - name: Retain audit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-dependency-audit
          path: dependency-audit.json
          if-no-files-found: error
          retention-days: 14
