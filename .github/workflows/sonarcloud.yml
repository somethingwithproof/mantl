name: SonarCloud

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      # Skip cleanly when the maintainer has not provisioned SONAR_TOKEN.
      # The scan never fails CI on a missing secret.
      - name: Check for SONAR_TOKEN
        id: guard
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "SONAR_TOKEN not set; skipping SonarCloud scan."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.guard.outputs.enabled == 'true'
        with:
          # Full history improves SonarCloud blame and new-code detection.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate coverage
        if: steps.guard.outputs.enabled == 'true'
        run: go test -coverprofile=coverage.out -covermode=atomic ./pkg/...

      - name: SonarCloud scan
        if: steps.guard.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
