---
# yamllint disable rule:line-length
name: SonarCloud
'on':
  workflow_call:
    inputs:
      coverage-artifacts:
        type: boolean
        default: true
      example-coverage-artifacts:
        type: boolean
        default: true
      pull-request:
        type: string
        default: ''
      head-branch:
        type: string
        default: ''
      base-branch:
        type: string
        default: ''
    secrets:
      SONAR_TOKEN:
        required: true
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: sonarcloud-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scan:
    name: SonarCloud quality gate
    runs-on: ${{ vars.DO_RUNNERS_ENABLED == 'true' && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","Linux","X64","mantl-do"]') || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - name: Require SonarCloud authentication
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "::error::SONAR_TOKEN is missing. SonarCloud analysis and its quality gate cannot run."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: ${{ inputs.coverage-artifacts && 'python' || 'go python' }}
      - name: Verify configured SonarCloud project
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          MANTL_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: mise exec -- python scripts/verify_sonar_project.py
      - name: Download Go coverage
        if: inputs.coverage-artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: go-coverage
      - name: Download Python coverage
        if: inputs.coverage-artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: python-coverage
      - name: Download isolated Python example coverage
        if: inputs.coverage-artifacts && inputs.example-coverage-artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: python-example-*-coverage
          path: coverage-examples
          merge-multiple: true
      - name: Generate first-party Go coverage
        if: '!inputs.coverage-artifacts'
        run: mise exec -- make go-coverage
      - name: Generate Python release-tool coverage
        if: '!inputs.coverage-artifacts'
        run: |
          mise exec -- python -m venv .venv-sonar
          mise exec -- .venv-sonar/bin/python -m pip install --only-binary :all: --require-hashes -r requirements-test.txt
          mise exec -- .venv-sonar/bin/python -m pytest tests/unit/ --cov=scripts --cov=ci --cov-report=xml:coverage-python.xml
      - name: Generate isolated Python example coverage
        if: '!inputs.coverage-artifacts'
        run: |
          set -euo pipefail
          mkdir -p coverage-examples
          for entry in publisher:event-driven-arch/publisher subscriber:event-driven-arch/subscriber products:ecommerce-microservices/src/products-api batch:batch-processing-job/src ml:ml-inference-service/src; do
            name="${entry%%:*}"
            source="examples/${entry#*:}"
            mise exec -- python -m venv ".venv-sonar/$name"
            mise exec -- ".venv-sonar/$name/bin/python" -m pip install --only-binary :all: --require-hashes -r requirements-test.txt -r "$source/requirements.txt"
            MANTL_TEST_EXAMPLE="$name" mise exec -- ".venv-sonar/$name/bin/python" -m pytest tests/examples/ --cov="$source" --cov-report="xml:coverage-examples/coverage-$name.xml"
          done
      - name: Use validated PR metadata for bot-dispatched analysis
        if: inputs.pull-request != ''
        env:
          PR_NUMBER: ${{ inputs.pull-request }}
          HEAD_BRANCH: ${{ inputs.head-branch }}
          BASE_BRANCH: ${{ inputs.base-branch }}
        run: |
          mise exec -- python - <<'PYCONFIG'
          import os
          from pathlib import Path
          keys = {"sonar.pullrequest.key": "PR_NUMBER", "sonar.pullrequest.branch": "HEAD_BRANCH", "sonar.pullrequest.base": "BASE_BRANCH"}
          values = {key: os.environ[name] for key, name in keys.items()}
          if any(not value or any(c in value for c in "\r\n\\") for value in values.values()):
              raise SystemExit("Invalid PR analysis metadata")
          with Path("sonar-project.properties").open("a") as config:
              for key, value in values.items():
                  config.write(f"{key}={value}\n")
          PYCONFIG
      - name: SonarCloud analysis and quality gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Save coverage reports
        if: always() && !inputs.coverage-artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sonar-coverage
          path: |
            coverage.out
            coverage-python.xml
          if-no-files-found: ignore
          retention-days: 7
