---
# yamllint disable rule:line-length
name: wp-ci
'on':
  pull_request:
    paths:
      - apps/pausatf-wp/**
      - .github/workflows/wp-ci.yml
  push:
    branches:
      - main
    paths:
      - apps/pausatf-wp/**
      - .github/workflows/wp-ci.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: wordpress-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  php-lint:
    runs-on: ${{ vars.DO_RUNNERS_ENABLED == 'true' && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","Linux","X64","mantl-do"]') || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: apps/pausatf-wp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install PHP source-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential autoconf bison re2c pkg-config \
            libxml2-dev libssl-dev libicu-dev libzip-dev libonig-dev \
            libcurl4-openssl-dev libsqlite3-dev libgd-dev libpng-dev \
            libjpeg-dev libfreetype6-dev libwebp-dev libgmp-dev \
            libsodium-dev libreadline-dev libbz2-dev
      - uses: ./.github/actions/setup
        with:
          tools: vfox:jdx/vfox-php github:composer/composer
          working-directory: apps/pausatf-wp
      - name: Validate and audit locked dependencies
        run: |
          composer_phar="$(mise where github:composer/composer)/composer.phar"
          mise exec -- php "$composer_phar" validate --strict --no-check-publish
          mise exec -- php "$composer_phar" audit --locked --no-interaction
      - name: Syntax-check tracked bootstrap PHP
        run: git ls-files -z '*.php' | xargs -0 -r -n1 mise exec -- php -l
      - name: Detect custom WordPress code
        id: custom
        run: |
          if git ls-files 'web/app/*.php' 'web/app/**/*.php' | grep -q .; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo '::notice::No tracked custom WordPress PHP; bootstrap syntax was validated.'
          fi
      - name: Cache Composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-php-8.4.26-composer-${{ hashFiles('apps/pausatf-wp/composer.json', 'apps/pausatf-wp/composer.lock')
            }}
          restore-keys: ${{ runner.os }}-php-8.4.26-composer-
      - name: Install dependencies
        run: |
          composer_phar="$(mise where github:composer/composer)/composer.phar"
          mise exec -- php "$composer_phar" install --no-interaction --prefer-dist --no-progress --no-scripts
        if: steps.custom.outputs.present == 'true'
      - name: PHPCS (WordPressCS)
        run: mise exec -- php vendor/bin/phpcs --standard=phpcs.xml.dist --report=full
        if: steps.custom.outputs.present == 'true'
      - name: PHPStan
        run: mise exec -- php vendor/bin/phpstan analyse --no-progress
        if: steps.custom.outputs.present == 'true'
    timeout-minutes: 25
