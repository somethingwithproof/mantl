---
# yamllint disable rule:line-length
name: Publish control content
'on':
  workflow_dispatch: {}
env:
  MISE_AUTO_INSTALL: 'false'
  MISE_EXEC_AUTO_INSTALL: 'false'
permissions:
  contents: read
concurrency:
  group: mantl-control-content
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Require main branch
        env:
          REF: ${{ github.ref }}
        run: test "$REF" = refs/heads/main || { echo "::error::Control publication requires main"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.10.2
          install_args: go python oras cosign
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify, publish and sign independently versioned content
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist/controls
          CONTENT_VERSION=$(cat compliance/bundle-version.txt)
          mise exec -- go test ./pkg/controlbundle ./pkg/framework
          mise exec -- go run ./cmd/mantl bundle build --version "$CONTENT_VERSION" --output dist/controls/controls.tar.gz > dist/controls/control-identity.json
          mise exec -- python scripts/publish_control_bundle.py --repository "ghcr.io/${REPOSITORY,,}-operator-controls" --version "$CONTENT_VERSION" --archive dist/controls/controls.tar.gz --identity dist/controls/oci-identity.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: control-content
          retention-days: 7
          path: dist/controls
          if-no-files-found: error
