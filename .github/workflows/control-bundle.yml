# SPDX-License-Identifier: Apache-2.0
---
# yamllint disable rule:line-length
name: Publish control content
'on':
  workflow_dispatch: {}
env:
  MISE_AUTO_INSTALL: 'false'
  MISE_EXEC_AUTO_INSTALL: 'false'
permissions:
  contents: read
concurrency:
  group: mantl-control-content
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ${{ vars.DO_RUNNERS_ENABLED == 'true' && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","Linux","X64","mantl-do"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Require main branch
        env:
          REF: ${{ github.ref }}
        run: test "$REF" = refs/heads/main || { echo "::error::Control publication requires main"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550
        with:
          version: 2026.10.2
          install_args: go python oras cosign
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify, publish and sign independently versioned content
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist/controls
          CONTENT_VERSION=$(cat compliance/bundle-version.txt)
          mise exec -- go test ./pkg/controlbundle ./pkg/framework
          mise exec -- go run ./cmd/mantl bundle build --version "$CONTENT_VERSION" --output dist/controls/controls.tar.gz > dist/controls/control-identity.json
          mise exec -- python scripts/publish_control_bundle.py --repository "ghcr.io/${REPOSITORY,,}-operator-controls" --version "$CONTENT_VERSION" --archive dist/controls/controls.tar.gz --identity dist/controls/oci-identity.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: control-content
          retention-days: 7
          path: dist/controls
          if-no-files-found: error
