name: Release
on:
  push:
    tags: [ 'v*.*.*' ]
permissions:
  contents: write
  packages: write
  id-token: write
jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: v5.4.3
      - name: Render bundles
        run: |
          mkdir -p dist
          kustomize build clusters/production > dist/cluster-production.yaml
          kustomize build addons/spinnaker/base > dist/spinnaker-base.yaml
      - name: Install ORAS
        uses: oras-project/setup-oras@v1
      - name: Push bundles to GHCR
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          oras push ghcr.io/${REPO_OWNER}/mantl-bundles:${GITHUB_REF_NAME} \
            --artifact-type application/vnd.cncf.kustomize+yaml \
            dist/cluster-production.yaml:application/yaml \
            dist/spinnaker-base.yaml:application/yaml
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0
      - name: Sign bundles (keyless)
        env:
          COSIGN_EXPERIMENTAL: 1
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          cosign sign --yes ghcr.io/${REPO_OWNER}/mantl-bundles:${GITHUB_REF_NAME}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/cluster-production.yaml
            dist/spinnaker-base.yaml