name: Release
on:
  release:
  workflow_dispatch:
    types: [published]
permissions:
  contents: write
  packages: write
  id-token: write
jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set tag
        id: tag
        run: echo "TAG=${GITHUB_REF_NAME:-${{ github.event.release.tag_name }}}" >> $GITHUB_OUTPUT
      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: v5.4.3
      - name: Render bundles
        run: |
          mkdir -p dist
          kustomize build clusters/production > dist/cluster-production.yaml
      - name: Install ORAS
        uses: oras-project/setup-oras@v1
      - name: Push bundles to GHCR
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          TAG: ${{ steps.tag.outputs.TAG }}
        run: |
          oras push ghcr.io/${REPO_OWNER}/mantl-bundles:${TAG} \
            --artifact-type application/vnd.cncf.kustomize+yaml \
            dist/cluster-production.yaml:application/yaml
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0
      - name: Sign bundles (keyless)
        env:
          COSIGN_EXPERIMENTAL: 1
          REPO_OWNER: ${{ github.repository_owner }}
          TAG: ${{ steps.tag.outputs.TAG }}
        run: |
          cosign sign --yes ghcr.io/${REPO_OWNER}/mantl-bundles:${TAG}
      # GitHub Release is already created by release-please; no need to create it here
