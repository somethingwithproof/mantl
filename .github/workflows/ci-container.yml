name: CI (container)

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [ main, "reorg/*", "feature/**" ]

jobs:
  container-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build dev image
        run: docker build -t mantl-dev:ci .

      # Scope to unit tests: tests/e2e and tests/integration assert against a
      # live cluster (api-server reachability, RBAC, prometheus) that this
      # container-only job does not provision.
      - name: Pytest
        run: docker run --rm -v "$PWD":/workspace -w /workspace mantl-dev:ci pytest -v tests/unit

      - name: Validate Kustomize (dev scope)
        run: |
          chmod +x ci/validate-kustomize-dev.sh
          docker run --rm -v "$PWD":/workspace -w /workspace mantl-dev:ci ./ci/validate-kustomize-dev.sh

      - name: Validate Terraform
        run: docker run --rm -v "$PWD":/workspace -w /workspace mantl-dev:ci ./ci/validate-terraform.sh
