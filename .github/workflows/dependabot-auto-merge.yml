# SPDX-License-Identifier: Apache-2.0
---
# yamllint disable rule:line-length
name: Dependabot Auto-Merge
'on':
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  schedule:
    - cron: 17 * * * *
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: dependabot-auto-merge
  cancel-in-progress: false
jobs:
  merge:
    # Verify the PR author's immutable Dependabot account ID.
    if: github.event_name != 'pull_request_target' || github.event.pull_request.user.id == 49699333
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Enable protected Dependabot auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          failed=0
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --author app/dependabot \
            --json number,isDraft,headRefOid --jq '.[] | select(.isDraft == false) | [.number, .headRefOid] | @tsv' > /tmp/dependabot-prs.tsv
          while read -r pr head; do
            # Dependabot records each update-type in the commit message; a
            # grouped PR lists every dependency, so any major skips the PR.
            if ! messages=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$pr/commits" --jq '.[].commit.message'); then
              echo "::error::Could not read commit metadata for PR #$pr"
              failed=1
              continue
            fi
            if grep -q 'update-type: version-update:semver-major' <<< "$messages"; then
              echo "::notice::Skipping PR #$pr: major update needs manual review"
              continue
            fi
            if gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --auto --squash --match-head-commit "$head"; then
              continue
            fi
            if ! current=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json state,isDraft,headRefOid); then
              failed=1
              continue
            fi
            if jq -e '.state != "OPEN" or .isDraft' <<< "$current" > /dev/null; then
              continue
            fi
            # The commits were checked against the old head, so leave a moved
            # head for the next scheduled run to check again.
            if test "$(jq -r '.headRefOid' <<< "$current")" != "$head"; then
              echo "::notice::PR #$pr head changed; rechecking on the next run"
              continue
            fi
            echo "::error::Could not enable protected auto-merge for PR #$pr"
            failed=1
          done < /tmp/dependabot-prs.tsv
          exit "$failed"
    timeout-minutes: 10
