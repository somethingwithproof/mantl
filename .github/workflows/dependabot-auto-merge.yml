---
# yamllint disable rule:line-length
name: Dependabot Auto-Merge
'on':
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  schedule:
    - cron: 17 * * * *
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: dependabot-auto-merge
  cancel-in-progress: false
jobs:
  merge:
    # Verify the PR author's immutable Dependabot account ID.
    if: github.event_name != 'pull_request_target' || github.event.pull_request.user.id == 49699333
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Enable protected Dependabot auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --author app/dependabot \
            --json number,isDraft,headRefOid --jq '.[] | select(.isDraft == false) | [.number, .headRefOid] | @tsv' |
          while read -r pr head; do
            gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --auto --squash --match-head-commit "$head"
          done
    timeout-minutes: 10
