# Validates AWS Terraform modules. Intentionally "soft" (continue-on-error)
# to avoid blocking PRs while modules evolve. We will add security/policy checks
# and consider OpenTofu support in future CI.
name: Terraform CI (aws)
on:
  pull_request:
    paths:
      - 'terraform/aws/**'
  push:
    branches: [ main, master ]
    paths:
      - 'terraform/aws/**'

jobs:
  validate-aws:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3
      - name: Terraform fmt
        run: terraform fmt -check -recursive
      - name: Terraform validate (soft)
        continue-on-error: true
        run: |
          terraform init -backend=false -input=false -no-color || true
          terraform validate -no-color || true
