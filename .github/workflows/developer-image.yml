---
# yamllint disable rule:line-length
name: Developer image
'on':
  workflow_call: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: developer-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: Developer image smoke test
    runs-on: ${{ vars.DO_RUNNERS_ENABLED == 'true' && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","Linux","X64","mantl-do"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          load: true
          tags: mantl-dev:ci
          cache-from: type=gha,scope=developer
          cache-to: type=gha,scope=developer,mode=max
      - name: Verify installed tools and non-root user
        run: |
          docker run --rm mantl-dev:ci python --version
          docker run --rm mantl-dev:ci terraform version
          test "$(docker inspect --format '{{.Config.User}}' mantl-dev:ci)" = mantl
