name: Auto-request reviews from assignees

on:
  pull_request_target:
    types: [assigned, opened, reopened, ready_for_review, edited, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  add-assignees-as-reviewers:
    runs-on: ubuntu-latest
    steps:
      - name: Request reviews from assignees (include author as assignee)
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.info('No PR in context');
              return;
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = pr.number;
            const author = pr.user.login;

            // Fetch latest PR
            const { data: fullPR } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            const assignees = new Set((fullPR.assignees || []).map(a => a.login));

            // Ensure the author is at least an assignee (GitHub cannot request review from author)
            if (!assignees.has(author)) {
              try {
                await github.rest.issues.addAssignees({ owner, repo, issue_number: prNumber, assignees: [author] });
                core.info(`Added author as assignee: ${author}`);
              } catch (e) {
                core.warning(`Could not add author as assignee: ${e.message}`);
              }
            }

            // Build reviewer candidate list = all assignees (including any newly added), excluding author
            const refreshed = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            const candidateSet = new Set((refreshed.data.assignees || []).map(a => a.login));
            candidateSet.delete(author); // API will reject author as reviewer
            const candidates = Array.from(candidateSet);

            if (candidates.length === 0) {
              core.info('No non-author assignees to request as reviewers.');
              return;
            }

            // Avoid duplicates
            const { data: requested } = await github.rest.pulls.listRequestedReviewers({ owner, repo, pull_number: prNumber });
            const already = new Set([ ...requested.users.map(u => u.login) ]);
            const toAdd = candidates.filter(u => !already.has(u));

            if (toAdd.length === 0) {
              core.info('All assignees already requested as reviewers.');
              return;
            }

            try {
              await github.rest.pulls.requestReviewers({ owner, repo, pull_number: prNumber, reviewers: toAdd });
              core.info(`Requested reviews from: ${toAdd.join(', ')}`);
            } catch (e) {
              core.warning(`Requesting reviewers failed: ${e.message}`);
            }
