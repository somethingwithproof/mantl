name: OpenTofu CI

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: opentofu-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-ci-matrix.yml'
  push:
    branches: [ main, rollup/** ]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-ci-matrix.yml'

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: '1.8.0'
      - name: OpenTofu fmt (repo)
        run: tofu fmt -check -recursive

  opentofu:
    name: OpenTofu validate (${{ matrix.path }})
    runs-on: ubuntu-latest
    if: ${{ hashFiles(format('{0}/**/*.tf', matrix.path)) != '' }}
    strategy:
      fail-fast: false
      matrix:
        path:
          - terraform/blueprints/aws-eks
          - terraform/blueprints/azure-aks
          - terraform/blueprints/do-doks
          - terraform/blueprints/gcp-gke
          - terraform/blueprints/ibm-iks
          - terraform/blueprints/linode-lke
          - terraform/blueprints/oci-oke
          - terraform/examples/aks-external-dns-wi
          - terraform/examples/gke-external-dns-wi
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v4
      - name: OpenTofu plugin cache
        run: echo "plugin_cache_dir=$HOME/.terraform.d/plugin-cache" >> $GITHUB_ENV
      - uses: actions/cache@v5
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-tofu-${{ hashFiles(format('{0}/**/*.tf', matrix.path)) }}
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: '1.8.0'
      - name: Init
        run: tofu init -backend=false -input=false
      - name: Validate
        run: tofu validate
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
      - name: Cache TFLint plugins
        uses: actions/cache@v5
        with:
          path: ~/.tflint.d/plugins
          key: ${{ runner.os }}-tflint-${{ hashFiles('.tflint.hcl') }}
      - name: TFLint init
        run: tflint --init
      - name: TFLint (blocking)
        run: tflint -f compact

  tfsec:
    name: tfsec (repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/tfsec-action@v1
        with:
          working_directory: terraform
          soft_fail: false
          sarif_file: tfsec.sarif
          additional_args: --config-file .tfsec.yml
      - name: Upload tfsec SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: tfsec.sarif
          category: tfsec

  checkov:
    name: Checkov (repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          soft_fail: false
          output_format: sarif
          output_file_path: checkov.sarif
          config_file: .checkov.yml
          severity: MEDIUM,HIGH,CRITICAL
      - name: Upload Checkov SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov.sarif
          category: checkov
