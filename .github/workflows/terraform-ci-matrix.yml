name: Terraform CI (matrix)

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-ci-matrix.yml'
  push:
    branches: [ rollup/** ]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-ci-matrix.yml'

jobs:
  terraform-aws:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.3'
      - name: Fmt (check)
        run: terraform fmt -check -recursive
        working-directory: .
      - name: Init
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate

  terraform-gce:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: terraform/gce
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.3'
      - name: Init
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate

  terraform-vsphere:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: terraform/vsphere
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.3'
      - name: Init
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate
