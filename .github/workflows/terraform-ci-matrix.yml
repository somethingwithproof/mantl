name: Terraform CI

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-ci-matrix.yml'
  push:
    branches: [ main, rollup/** ]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-ci-matrix.yml'

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.9'
      - name: Terraform fmt (repo)
        run: terraform fmt -check -recursive

  terraform:
    name: Terraform validate (${{ matrix.path }})
    runs-on: ubuntu-latest
    if: ${{ hashFiles(format('{0}/**/*.tf', matrix.path)) != '' }}
    strategy:
      fail-fast: false
      matrix:
        path:
          - terraform/blueprints/aws-eks
          - terraform/blueprints/azure-aks
          - terraform/blueprints/do-doks
          - terraform/blueprints/gcp-gke
          - terraform/blueprints/ibm-iks
          - terraform/blueprints/linode-lke
          - terraform/blueprints/oci-oke
          - terraform/examples/aks-external-dns-wi
          - terraform/examples/gke-external-dns-wi
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v4
      - name: Terraform plugin cache
        run: echo "plugin_cache_dir=$HOME/.terraform.d/plugin-cache" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-tf-${{ hashFiles(format('{0}/**/*.tf', matrix.path)) }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.9'
      - name: Init
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
      - name: TFLint init
        run: tflint --init
      - name: TFLint (blocking)
        run: tflint -f compact

  tfsec:
    name: tfsec (repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/tfsec-action@v1
        with:
          working_directory: terraform
          soft_fail: false

  checkov:
    name: Checkov (repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          soft_fail: false
