---
# yamllint disable rule:line-length
name: Mutation Testing
'on':
  schedule:
    - cron: 41 4 * * 2
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gremlins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: go
      - name: Install pinned mutation tool
        run: mise exec -- go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
      - name: Measure mutation baseline
        run: mise exec -- gremlins unleash --dry-run=false ./pkg/...
    timeout-minutes: 30
