---
# yamllint disable rule:line-length
name: Artifact provenance
'on':
  workflow_call:
    inputs:
      hashes:
        required: true
        type: string
      tag:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: slsa-provenance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  attest:
    permissions:
      actions: read
      contents: write
      id-token: write
    # Pin exception: the SLSA generator must be referenced by its release tag
    # (@vX.Y.Z), not a commit SHA. It verifies its own ref at runtime and
    # fails otherwise, and slsa-verifier cannot verify provenance built from
    # a SHA ref. v2.1.0 is commit f7dd8c54c2067bafc12ca7a55595d5ee9b75204a.
    # See the generator README, "Referencing SLSA builders and generators".
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses]
    with:
      base64-subjects: ${{ inputs.hashes }}
      upload-assets: true
      upload-tag-name: ${{ inputs.tag }}
      private-repository: ${{ github.event.repository.private }}
