---
# yamllint disable rule:line-length
name: Artifact provenance
'on':
  workflow_call:
    inputs:
      hashes:
        required: true
        type: string
      tag:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: slsa-provenance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  attest:
    permissions:
      actions: read
      contents: write
      id-token: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ inputs.hashes }}
      upload-assets: true
      upload-tag-name: ${{ inputs.tag }}
      private-repository: ${{ github.event.repository.private }}
