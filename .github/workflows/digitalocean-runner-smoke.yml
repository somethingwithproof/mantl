---
# yamllint disable rule:line-length
name: DigitalOcean runner smoke
'on':
  workflow_dispatch: {}
  pull_request:
    paths:
      - .github/workflows/digitalocean-runner-smoke.yml
permissions:
  contents: read
concurrency:
  group: digitalocean-smoke-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, mantl-do]
    timeout-minutes: 10
    steps:
      - name: Verify isolated runner prerequisites
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = self-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          for tool in git curl jq unzip gh; do
            command -v "$tool"
          done
          docker info >/dev/null
          docker buildx version
          sudo -n true
          test -d /opt/hostedtoolcache
          test -w /opt/hostedtoolcache
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: go python
      - name: Verify mise runtimes and disposable containers
        run: |
          mise exec -- go version
          mise exec -- python --version
          docker run --rm --network none --entrypoint /bin/sh nginx:1.31.0-alpine -c true
          printf 'Runner contract passed for %s on %s\n' "$GITHUB_REPOSITORY" "$RUNNER_NAME"
