name: Helm Validate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: helm-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5

      # Only first-party charts under charts/ are linted. Vendored upstream
      # charts in platform/ are excluded by path.
      - name: Lint and template charts
        run: |
          set -euo pipefail
          found=0
          for chart in charts/*/; do
            if [ -f "${chart}Chart.yaml" ]; then
              found=1
              echo "::group::helm lint ${chart}"
              helm lint "${chart}"
              echo "::endgroup::"
              # Templating an umbrella chart needs its subchart dependencies
              # present. Fetch them; if external repos cannot be resolved, lint
              # has already validated the chart, so warn rather than fail CI.
              # stderr is kept (not suppressed) so a real fetch error is visible.
              if helm dependency build "${chart}" || helm dependency update "${chart}"; then
                echo "::group::helm template ${chart}"
                helm template "${chart}" >/dev/null
                echo "::endgroup::"
              else
                echo "::warning::skipping helm template for ${chart}: external dependencies could not be resolved"
              fi
            fi
          done
          if [ "${found}" -eq 0 ]; then
            echo "No charts found under charts/" >&2
            exit 1
          fi
