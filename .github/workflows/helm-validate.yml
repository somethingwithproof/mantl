---
# yamllint disable rule:line-length
name: Charts and manifests
'on':
  workflow_call: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: charts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  validate:
    name: Chart and manifest validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: helm kustomize kubeconform
      - name: Cache locked chart dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |-
            charts/*/charts
            ~/.cache/helm
          key: ${{ runner.os }}-helm-${{ hashFiles('charts/**/Chart.lock', 'charts/**/Chart.yaml', 'mise.toml') }}
      - name: Lint and render first-party charts
        run: |
          for chart in charts/*/; do
            test -f "${chart}Chart.yaml" || continue
            mise exec -- helm dependency build "$chart"
            mise exec -- helm lint "$chart"
            mise exec -- helm template mantl "$chart" > "$RUNNER_TEMP/chart.yaml"
          done
      - name: Render stable GitOps manifests
        run: |
          mise exec -- bash ci/validate-kustomize-dev.sh
          for path in deploy/operator/base deploy/fleet/base deploy/gitops/policies deploy/gitops/core; do
            mise exec -- kustomize build "$path" > "$RUNNER_TEMP/manifest.yaml"
            mise exec -- kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.35.0 -summary "$RUNNER_TEMP/manifest.yaml"
          done
