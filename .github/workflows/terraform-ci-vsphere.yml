name: Terraform CI (vsphere)
on:
  pull_request:
    paths:
      - 'terraform/vsphere/**'
  push:
    branches: [ main, master ]
    paths:
      - 'terraform/vsphere/**'

jobs:
  validate-vsphere:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/vsphere
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5
      - name: Terraform fmt
        run: terraform fmt -check -recursive
      # validate intentionally skipped due to provider auth requirements
