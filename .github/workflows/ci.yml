name: Mantl CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      # Build to dist/ to avoid colliding with the tracked bin/mantl bash CLI.
      - name: Build CLI
        run: go build -v -o dist/mantl ./cmd/mantl

      - name: Run unit tests
        run: make go-test

      - name: Validate spec planning
        run: ./dist/mantl plan examples/mantl-spec.yaml

      - name: Build Compliance Operator
        run: go build -v -o dist/compliance-operator ./cmd/compliance-operator

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
