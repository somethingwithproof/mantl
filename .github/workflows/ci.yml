---
# yamllint disable rule:line-length
name: Mantl CI
'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pull-request:
        description: Optional PR number; dispatch on that PR head branch
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  changes:
    name: Select component checks
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python_examples: ${{ steps.paths.outputs.python_examples }}
      example_matrix: ${{ steps.paths.outputs.example_matrix }}
      infrastructure: ${{ steps.paths.outputs.infrastructure }}
      charts: ${{ steps.paths.outputs.charts }}
      runtime: ${{ steps.paths.outputs.runtime }}
      frontend: ${{ steps.paths.outputs.frontend }}
      ml_example: ${{ steps.paths.outputs.ml_example }}
      developer_image: ${{ steps.paths.outputs.developer_image }}
      pull_request: ${{ steps.pr.outputs.pull_request }}
      head_branch: ${{ steps.pr.outputs.head_branch }}
      base_branch: ${{ steps.pr.outputs.base_branch }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: python
      - name: Resolve current pull request context
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull-request || github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          ALLOW_FORK: ${{ github.event_name == 'pull_request' }}
        run: mise exec -- python ci/pr_context.py >> "$GITHUB_OUTPUT"
      - name: Select checks from changed paths
        id: paths
        env:
          BASE: ${{ steps.pr.outputs.base_sha || github.event.before }}
          HEAD: ${{ github.sha }}
          FULL_EXAMPLES: ${{ github.event_name != 'pull_request' && steps.pr.outputs.pull_request == '' }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then
            git ls-files -z | mise exec -- python ci/changed_components.py >> "$GITHUB_OUTPUT"
          else
            git diff --name-only -z "$BASE" "$HEAD" | mise exec -- python ci/changed_components.py >> "$GITHUB_OUTPUT"
          fi
  go:
    name: Go tests and coverage
    runs-on: ${{ vars.DO_RUNNERS_ENABLED == 'true' && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","Linux","X64","mantl-do"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: go golangci-lint
      - name: Verify dependencies and formatting
        run: |
          set -euo pipefail
          mise exec -- go mod verify
          unformatted=$(git ls-files -z '*.go' ':!:platform/**' ':!:policies/kyverno/charts/**' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: Test all first-party packages with coverage
        run: mise exec -- make go-coverage
      - name: Lint first-party Go code
        run: mise exec -- golangci-lint run
      - name: Check generated APIs and CLI planning
        run: |
          mise exec -- make manifests generate
          git diff --exit-code
          mise exec -- go run ./cmd/mantl plan examples/mantl-spec.yaml
      - name: Retain Go coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 7
  python:
    name: Python tests and coverage
    needs: changes
    runs-on: ${{ vars.DO_RUNNERS_ENABLED == 'true' && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","Linux","X64","mantl-do"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: python terraform kubectl kustomize uv
      - name: Verify Python dependency locks
        run: mise exec -- python -m ci.lock_python_dependencies --check
      - name: Test infrastructure contracts and release tools
        run: |
          mise exec -- python -m venv .venv-ci
          mise exec -- .venv-ci/bin/python -m pip install --only-binary :all: --require-hashes -r requirements-test.txt
          mise exec -- .venv-ci/bin/python -m pytest tests/unit/ --cov=scripts --cov=ci --cov-report=xml:coverage-python.xml
      - name: Check ML example dependency and runtime compatibility
        if: needs.changes.outputs.ml_example == 'true'
        run: |
          mise exec -- python -m venv .venv-ml
          mise exec -- .venv-ml/bin/python -m pip install --only-binary :all: --require-hashes -r requirements-test.txt -r examples/ml-inference-service/src/requirements.txt
          mise exec -- .venv-ml/bin/python -m coverage run --source=scripts,ci ci/smoke_ml_example.py
          mise exec -- .venv-ci/bin/python -m coverage combine --append
          mise exec -- .venv-ci/bin/python -m coverage xml -o coverage-python.xml
      - name: Retain Python coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-coverage
          path: coverage-python.xml
          if-no-files-found: error
          retention-days: 7
  python_examples:
    needs: changes
    if: needs.changes.outputs.python_examples == 'true'
    name: Python example (${{ matrix.example.name }})
    runs-on: ${{ vars.DO_RUNNERS_ENABLED == 'true' && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","Linux","X64","mantl-do"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.changes.outputs.example_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: python
      - name: Test example error and shutdown contracts
        env:
          MANTL_TEST_EXAMPLE: ${{ matrix.example.name }}
          EXAMPLE_SOURCE: ${{ matrix.example.source }}
        run: |
          set -euo pipefail
          mise exec -- python -m venv .venv-ci
          mise exec -- .venv-ci/bin/python -m pip install --only-binary :all: --require-hashes -r requirements-test.txt -r "$EXAMPLE_SOURCE/requirements.txt"
          mise exec -- .venv-ci/bin/python -m pytest tests/examples/ --cov="$EXAMPLE_SOURCE" --cov-report="xml:coverage-${MANTL_TEST_EXAMPLE}.xml"
      - name: Retain example coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-example-${{ matrix.example.name }}-coverage
          path: coverage-${{ matrix.example.name }}.xml
          if-no-files-found: error
          retention-days: 7
  repository:
    name: Repository checks
    needs: changes
    uses: ./.github/workflows/pre-commit.yml
    with:
      base-ref: ${{ needs.changes.outputs.base_sha || github.event.before }}
  sonar:
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.go.result == 'success' && needs.python.result == 'success' && (needs.python_examples.result == 'success' || (needs.changes.outputs.python_examples == 'false' && needs.python_examples.result == 'skipped')) }}
    name: SonarCloud
    needs:
      - changes
      - go
      - python
      - python_examples
    uses: ./.github/workflows/sonarcloud.yml
    with:
      coverage-artifacts: true
      example-coverage-artifacts: ${{ needs.changes.outputs.python_examples == 'true' }}
      pull-request: ${{ needs.changes.outputs.pull_request }}
      head-branch: ${{ needs.changes.outputs.head_branch }}
      base-branch: ${{ needs.changes.outputs.base_branch }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  infrastructure:
    name: Infrastructure
    needs: changes
    if: needs.changes.outputs.infrastructure == 'true'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/terraform-validate.yml
  charts:
    name: Charts and manifests
    needs: changes
    if: needs.changes.outputs.charts == 'true'
    uses: ./.github/workflows/helm-validate.yml
  runtime:
    name: Runtime and packages
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    uses: ./.github/workflows/compliance-runtime.yml
  frontend:
    name: Example frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/example-frontend.yml
  developer_image:
    name: Developer image
    needs: changes
    if: needs.changes.outputs.developer_image == 'true'
    uses: ./.github/workflows/developer-image.yml
  ci:
    name: CI
    needs:
      - changes
      - go
      - python
      - python_examples
      - sonar
      - infrastructure
      - charts
      - runtime
      - frontend
      - developer_image
      - repository
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful selected checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          GO_RESULT: ${{ needs.go.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          PYTHON_EXAMPLES_SELECTED: ${{ needs.changes.outputs.python_examples }}
          PYTHON_EXAMPLES_RESULT: ${{ needs.python_examples.result }}
          SONAR_RESULT: ${{ needs.sonar.result }}
          INFRASTRUCTURE_SELECTED: ${{ needs.changes.outputs.infrastructure }}
          INFRASTRUCTURE_RESULT: ${{ needs.infrastructure.result }}
          CHARTS_SELECTED: ${{ needs.changes.outputs.charts }}
          CHARTS_RESULT: ${{ needs.charts.result }}
          RUNTIME_SELECTED: ${{ needs.changes.outputs.runtime }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          FRONTEND_SELECTED: ${{ needs.changes.outputs.frontend }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          DEVELOPER_IMAGE_SELECTED: ${{ needs.changes.outputs.developer_image }}
          DEVELOPER_IMAGE_RESULT: ${{ needs.developer_image.result }}
          REPOSITORY_RESULT: ${{ needs.repository.result }}
        run: |
          set -euo pipefail
          for result in "$CHANGES_RESULT" "$GO_RESULT" "$PYTHON_RESULT" "$SONAR_RESULT" "$REPOSITORY_RESULT"; do
            if [ "$result" != success ]; then
              echo "::error::A required CI prerequisite failed: $result"
              exit 1
            fi
          done
          require_selected() {
            case "$1:$2" in
              true:success|false:skipped) ;;
              *) echo "::error::Selected component check did not succeed: $3 ($1:$2)"; exit 1 ;;
            esac
          }
          require_selected "$PYTHON_EXAMPLES_SELECTED" "$PYTHON_EXAMPLES_RESULT" python_examples
          require_selected "$INFRASTRUCTURE_SELECTED" "$INFRASTRUCTURE_RESULT" infrastructure
          require_selected "$CHARTS_SELECTED" "$CHARTS_RESULT" charts
          require_selected "$RUNTIME_SELECTED" "$RUNTIME_RESULT" runtime
          require_selected "$FRONTEND_SELECTED" "$FRONTEND_RESULT" frontend
          require_selected "$DEVELOPER_IMAGE_SELECTED" "$DEVELOPER_IMAGE_RESULT" developer_image
          echo "All required and selected checks passed."
