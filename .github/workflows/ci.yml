name: Mantl CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: [self-hosted]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache: true

    - name: Install dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Build CLI
      run: go build -v -o bin/mantl ./cmd/mantl

    - name: Run unit tests
      run: go test -v ./...

    - name: Validate spec planning
      run: ./bin/mantl plan examples/mantl-spec.yaml

    - name: Build Compliance Operator
      run: go build -v -o bin/compliance-operator ./cmd/compliance-operator

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest
