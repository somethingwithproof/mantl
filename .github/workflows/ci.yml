name: CI

on:
  push:
    branches: [ main, "reorg/*", "feature/**" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'  # Changed from 3.13 for better compatibility
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (black, ruff, yamllint)
        run: |
          black --check .
          ruff check .
          yamllint .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Run tests with coverage
        run: |
          pytest -v --cov=. --cov-report=xml --cov-report=html --cov-report=term-missing
          coverage report --fail-under=60

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-mantl

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30

      - name: Comment coverage on PR
        uses: py-cov-action/python-coverage-comment-action@v3
        if: github.event_name == 'pull_request'
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINIMUM_GREEN: 60
          MINIMUM_ORANGE: 50

  security-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install safety
        run: pip install safety pip-audit

      - name: Check dependencies for vulnerabilities (safety)
        run: safety check --json

      - name: Audit dependencies (pip-audit)
        run: pip-audit

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.3

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: |
          find infra/terraform -type d -maxdepth 2 -mindepth 1 -print0 | \
            xargs -0 -I {} sh -c 'cd {} && terraform init -backend=false -no-color && terraform validate -no-color'

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@0.34.1
        with:
          scan-type: 'fs'
          scanners: 'vuln,secret,config'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: '.'
          soft_fail: false

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: '.'
          quiet: true
          soft_fail: false

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: '.'
          format: 'spdx-json'
          output-file: 'sbom.spdx.json'

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v6
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: mantl-dev:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.34.1
        with:
          image-ref: 'mantl-dev:ci'
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy image scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-image-results.sarif'

      - name: Run tests in container
        run: docker run --rm -v "$PWD":/workspace -w /workspace mantl-dev:ci pytest -v tests

      - name: Validate Kustomize builds
        run: |
          chmod +x ci/validate-kustomize.sh
          docker run --rm -v "$PWD":/workspace -w /workspace mantl-dev:ci ./ci/validate-kustomize.sh

      - name: Validate Terraform
        run: docker run --rm -v "$PWD":/workspace -w /workspace mantl-dev:ci ./ci/validate-terraform.sh

  image-publish:
    name: Build, push, and sign image
    runs-on: ubuntu-latest
    needs: [lint, test, security-scan, container-build]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mantl-dev:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/mantl-dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.0.0

      - name: Sign image (keyless)
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          cosign sign --yes ghcr.io/${{ github.repository_owner }}/mantl-dev:${{ github.sha }}
          cosign sign --yes ghcr.io/${{ github.repository_owner }}/mantl-dev:latest

  kind-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: helm/kind-action@v1
        with:
          cluster_name: mantl

      - name: Verify cluster
        run: |
          kubectl get nodes
          kubectl cluster-info

  policy-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check for placeholder secrets
        run: |
          chmod +x ci/check-placeholders.sh
          ./ci/check-placeholders.sh

      - name: Install Kyverno CLI
        run: |
          curl -LO https://github.com/kyverno/kyverno/releases/download/v1.12.1/kyverno-cli_v1.12.1_linux_x86_64.tar.gz
          tar -xzf kyverno-cli_v1.12.1_linux_x86_64.tar.gz
          sudo mv kyverno /usr/local/bin/

      - name: Validate Kyverno policies
        run: |
          find policies/kyverno -name "*.yaml" -type f | while read policy; do
            echo "Validating: $policy"
            kyverno validate "$policy"
          done

  notify:
    runs-on: ubuntu-latest
    needs: [lint, test, security-scan, container-build]
    if: failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Slack notification
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          STATUS="Workflow failed: $GITHUB_WORKFLOW (#$GITHUB_RUN_NUMBER) on $GITHUB_REF"
          DETAILS="Repo: $GITHUB_REPOSITORY - Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl -X POST -H 'Content-type: application/json' --data "{\"text\": \"${STATUS}\n${DETAILS}\"}" "$SLACK_WEBHOOK_URL"
