name: CI

on:
  push:
    branches: [main, "reorg/*", "feature/**"]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.13'
  KUSTOMIZE_VERSION: 'v5.4.3'
  TERRAFORM_VERSION: '1.14.3'

jobs:
  # ============================================================================
  # Code Quality Jobs
  # ============================================================================

  lint:
    name: Lint (Python, YAML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Black format check
        run: black --check .

      - name: Ruff lint
        run: ruff check .

      - name: YAML lint
        run: yamllint .

  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt mypy types-PyYAML types-requests

      - name: Run mypy
        run: mypy --install-types --non-interactive . || true
        continue-on-error: true

  # ============================================================================
  # Test Jobs
  # ============================================================================

  test:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Run tests with coverage
        run: |
          pytest -v \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-report=html \
            --cov-fail-under=70 \
            --junitxml=junit.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-mantl
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            junit.xml
            coverage.xml
            htmlcov/

  container-tests:
    name: Container Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev image (cached)
        uses: docker/build-push-action@v5
        with:
          context: .
          tags: mantl-dev:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run pytest in container
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace mantl-dev:ci \
            pytest -v --cov=. --cov-report=term-missing tests/

      - name: Validate Kustomize
        run: |
          chmod +x ci/validate-kustomize.sh
          docker run --rm -v "$PWD":/workspace -w /workspace mantl-dev:ci \
            ./ci/validate-kustomize.sh

      - name: Validate Terraform
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace mantl-dev:ci \
            ./ci/validate-terraform.sh

  # ============================================================================
  # Infrastructure Validation Jobs
  # ============================================================================

  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        continue-on-error: true
        run: |
          find infra/terraform -type d -maxdepth 2 -mindepth 1 -print0 | \
            xargs -0 -I {} sh -c 'cd {} && terraform init -backend=false -no-color || true; terraform validate -no-color || true'

  platform-health:
    name: Platform Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: ${{ env.KUSTOMIZE_VERSION }}

      - name: Build production manifests
        run: kustomize build clusters/production > rendered.yaml

      - name: Kubeconform validate
        run: |
          docker run --rm -v "$PWD":/project -w /project \
            ghcr.io/yannh/kubeconform:latest \
            -strict -ignore-missing-schemas -summary rendered.yaml

  # ============================================================================
  # Kubernetes E2E Jobs
  # ============================================================================

  kind-smoke:
    name: Kind Cluster Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: helm/kind-action@v1
        with:
          cluster_name: mantl

      - name: Verify cluster
        run: |
          kubectl get nodes
          kubectl cluster-info

  e2e-hello:
    name: E2E Hello World
    runs-on: ubuntu-latest
    needs: [kind-smoke]
    steps:
      - uses: actions/checkout@v4

      - uses: helm/kind-action@v1
        with:
          cluster_name: mantl-e2e

      - name: Deploy example hello
        run: |
          kubectl apply -k apps/examples/hello
          kubectl rollout status deploy/app -n default --timeout=120s

      - name: Port-forward and test
        run: |
          kubectl port-forward svc/app -n default 8080:80 &
          PF_PID=$!
          sleep 3
          curl -fsS http://127.0.0.1:8080/ | head -c 100
          kill $PF_PID || true

  external-dns-e2e:
    name: External DNS E2E
    runs-on: ubuntu-latest
    needs: [kind-smoke]
    steps:
      - uses: actions/checkout@v4

      - uses: helm/kind-action@v1
        with:
          cluster_name: mantl-dns

      - name: Deploy test DNS (bind9)
        run: |
          kubectl apply -f tests/e2e/external-dns/rfc2136/bind9.yaml
          kubectl -n dns wait --for=condition=available deploy/bind9 --timeout=180s

      - name: Install ExternalDNS
        run: |
          helm repo add external-dns https://kubernetes-sigs.github.io/external-dns/
          helm upgrade --install extdns external-dns/external-dns \
            --namespace external-dns --create-namespace \
            -f tests/e2e/external-dns/rfc2136/values.yaml

      - name: Create and verify DNS record
        run: |
          kubectl apply -f tests/e2e/external-dns/rfc2136/app-svc.yaml
          sleep 30
          kubectl run -n dns dig --image=infoblox/dnstools --restart=Never --rm -it --command -- \
            dig @bind9.dns.svc.cluster.local app.test.local +short || true

  gateway-smoke:
    name: Gateway API Smoke Test
    runs-on: ubuntu-latest
    needs: [kind-smoke]
    steps:
      - uses: actions/checkout@v4

      - uses: helm/kind-action@v1
        with:
          cluster_name: mantl-gw

      - name: Install Gateway API CRDs
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.1.0/config/crd/experimental/gateway.networking.k8s.io_gatewayclasses.yaml
          kubectl apply -f https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.1.0/config/crd/standard

      - name: Apply gateway sample manifests
        run: |
          kubectl apply -k platform/ingress/gateway-api/sample || true
          kubectl get gatewayclasses,gateway,httproutes -A

  # ============================================================================
  # Policy Jobs
  # ============================================================================

  policy-tests:
    name: Kyverno Policy Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: ${{ env.KUSTOMIZE_VERSION }}

      - name: Render manifests
        run: kustomize build clusters/production > rendered.yaml

      - name: Install Kyverno CLI
        run: |
          curl -LO https://github.com/kyverno/kyverno/releases/download/v1.12.1/kyverno-cli_v1.12.1_linux_x86_64.tar.gz
          tar -xzf kyverno-cli_v1.12.1_linux_x86_64.tar.gz
          sudo mv kyverno /usr/local/bin/

      - name: Test policies (soft on PR)
        if: github.event_name == 'pull_request'
        run: kyverno apply policies/kyverno/policies/ --resource rendered.yaml || true

      - name: Test policies (strict on main)
        if: github.event_name != 'pull_request'
        run: kyverno apply policies/kyverno/policies/ --resource rendered.yaml

  policy-placeholder-check:
    name: Policy Placeholder Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Kyverno policy placeholders
        run: ci/check-placeholders.sh

  # ============================================================================
  # Security Jobs
  # ============================================================================

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Python dependency vulnerability scan (Safety)
        run: |
          pip install safety
          safety check -r requirements.txt --output json > safety-results.json || true
          safety check -r requirements.txt || true
        continue-on-error: true

      - name: TFSec scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working-directory: .
          additional_args: --soft-fail

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scanners: vuln,secret,config
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Checkov IaC scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          quiet: true
          soft_fail: true

      - name: Upload security scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-results
          path: |
            safety-results.json
            trivy-results.sarif

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

  # ============================================================================
  # Build and Publish Jobs (main/tags only)
  # ============================================================================

  image-build-and-sign:
    name: Build and Sign Image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, terraform]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/mantl-dev:${{ github.sha }}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign image (keyless)
        env:
          COSIGN_EXPERIMENTAL: 1
        run: cosign sign --yes ${{ steps.build.outputs.image }}

  publish-bundles:
    name: Publish Kustomize Bundles
    runs-on: ubuntu-latest
    needs: [image-build-and-sign]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: ${{ env.KUSTOMIZE_VERSION }}

      - name: Render bundles
        run: |
          mkdir -p dist
          kustomize build clusters/production > dist/cluster-production.yaml

      - name: Install ORAS
        uses: oras-project/setup-oras@v1

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push bundles to GHCR
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          oras push ghcr.io/${REPO_OWNER}/mantl-bundles:$(echo $GITHUB_SHA | cut -c1-12) \
            --artifact-type application/vnd.cncf.kustomize+yaml \
            dist/cluster-production.yaml:application/yaml

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign bundles
        env:
          COSIGN_EXPERIMENTAL: 1
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          cosign sign --yes ghcr.io/${REPO_OWNER}/mantl-bundles:$(echo $GITHUB_SHA | cut -c1-12)

  # ============================================================================
  # Cache Warming (main only)
  # ============================================================================

  warm-cache:
    name: Warm Docker Cache
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pre-build dev image
        uses: docker/build-push-action@v5
        with:
          context: .
          tags: mantl-dev:cache
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Notification Job
  # ============================================================================

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [lint, test, terraform, container-tests]
    if: failure()
    steps:
      - name: Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            STATUS="Workflow failed: $GITHUB_WORKFLOW (#$GITHUB_RUN_NUMBER) on $GITHUB_REF"
            curl -X POST -H 'Content-type: application/json' \
              --data "{\"text\": \"$STATUS\nRepo: $GITHUB_REPOSITORY\nRun: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" \
              "$SLACK_WEBHOOK_URL"
          else
            echo "SLACK_WEBHOOK_URL not set; skipping"
          fi
