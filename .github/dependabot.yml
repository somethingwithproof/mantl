# GitHub Dependabot configuration
# Provides automated dependency updates and security alerts
# Complements Renovate for comprehensive dependency management

version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5
    reviewers:
      - "thomasvincent"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 5
    reviewers:
      - "thomasvincent"
    commit-message:
      prefix: "deps"
      include: "scope"
    ignore:
      # Let Renovate handle these
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]

  # Terraform
  - package-ecosystem: "terraform"
    directory: "/infra/terraform/terraform/blueprints/aws-eks"
    schedule:
      interval: "weekly"
      day: "sunday"
    labels:
      - "dependencies"
      - "terraform"
    open-pull-requests-limit: 5
    reviewers:
      - "thomasvincent"
    commit-message:
      prefix: "infra"
      include: "scope"

  # Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    labels:
      - "dependencies"
      - "docker"
    open-pull-requests-limit: 5
    reviewers:
      - "thomasvincent"
    commit-message:
      prefix: "build"
      include: "scope"
