[pytest]
# Pytest configuration for mantl project

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=.
    --cov-report=term-missing
    --cov-report=xml
    --cov-report=html

# Markers for test categorization
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may require infrastructure)
    e2e: End-to-end tests (require full environment)
    slow: Slow tests (take more than 10 seconds)
    requires_cluster: Tests that require a Kubernetes cluster
    requires_terraform: Tests that require Terraform CLI
    requires_kyverno: Tests that require Kyverno CLI

# Coverage options
[coverage:run]
source = .
omit =
    */tests/*
    */site-packages/*
    */.venv/*
    */venv/*
    */__pycache__/*
    */migrations/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
