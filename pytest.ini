[pytest]
# Pytest configuration for mantl project

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
#
# Coverage is intentionally not enforced by default. tests/ here validate
# infrastructure files (Terraform, YAML, Helm, shell, CI config); they do not
# import a Python application, so `--cov=.` over the whole repo measures 0% and
# a fail-under gate is meaningless. Run coverage explicitly when there is Python
# under test, e.g. `pytest --cov=<package> --cov-report=term-missing`.
addopts =
    -v
    --strict-markers
    --tb=short

# Markers for test categorization
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may require infrastructure)
    e2e: End-to-end tests (require full environment)
    slow: Slow tests (take more than 10 seconds)
    requires_cluster: Tests that require a Kubernetes cluster
    requires_terraform: Tests that require Terraform CLI
    requires_kyverno: Tests that require Kyverno CLI
    shell_scripts: Shell script validation tests
    security: Security-related tests
    network_policies: Network policy tests
    yaml_validation: YAML manifest validation tests

# Coverage options
[coverage:run]
source = .
omit =
    */tests/*
    */site-packages/*
    */.venv/*
    */venv/*
    */__pycache__/*
    */migrations/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
