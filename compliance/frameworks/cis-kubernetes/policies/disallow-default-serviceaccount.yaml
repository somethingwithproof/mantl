# CIS Kubernetes 5.1.5 - Disallow Default ServiceAccount
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: cis-disallow-default-serviceaccount
  labels:
    compliance.mantl.io/framework: cis-kubernetes
    compliance.mantl.io/control: "5.1.5"
    compliance.mantl.io/severity: medium
  annotations:
    policies.kyverno.io/title: Disallow Default ServiceAccount
    policies.kyverno.io/category: CIS Kubernetes Benchmark
    policies.kyverno.io/severity: medium
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: deny-default-serviceaccount
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
      validate:
        message: |
          CIS 5.1.5 Violation: Using default ServiceAccount is not allowed.
          Create and use a dedicated ServiceAccount for your workloads.

          Current: {{request.object.spec.serviceAccountName}}
        pattern:
          spec:
            serviceAccountName: "!default"
