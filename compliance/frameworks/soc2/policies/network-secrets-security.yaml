# Kyverno Policy Pack: Network and Secrets Security
# Implements: SOC2-CC6.6, CC6.7, CC6.8, HIPAA, PCI-DSS
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-tls-ingress
  labels:
    compliance.mantl.io/controls: "SOC2-CC6.8,HIPAA-164.312(e)(2)(ii)"
    compliance.mantl.io/severity: critical
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-tls
      match:
        any:
          - resources:
              kinds:
                - Ingress
      validate:
        message: "Ingress must have TLS configured. Control: SOC2-CC6.8"
        pattern:
          spec:
            tls:
              - hosts:
                  - "*"
                secretName: "?*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: deny-secrets-in-env
  labels:
    compliance.mantl.io/controls: "SOC2-CC6.6"
    compliance.mantl.io/severity: critical
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: deny-secret-env-vars
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Secrets should not be exposed as environment variables. Control: SOC2-CC6.6"
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  - key: "{{ element.env[?valueFrom.secretKeyRef] | length(@) }}"
                    operator: GreaterThan
                    value: 0
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-network-policies
  labels:
    compliance.mantl.io/controls: "SOC2-CC6.1,SOC2-CC6.7"
    compliance.mantl.io/severity: high
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-network-policy
      match:
        any:
          - resources:
              kinds:
                - Namespace
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
      validate:
        message: "Namespace must have a NetworkPolicy. Control: SOC2-CC6.7"
        deny:
          conditions:
            all:
              - key: "{{ request.operation }}"
                operator: Equals
                value: CREATE
