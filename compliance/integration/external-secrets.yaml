# External Secrets for Compliance Module
# Pulls credentials from secrets manager for evidence storage and notifications
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: compliance-aws-credentials
  namespace: compliance-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: compliance-aws-credentials
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: mantl/compliance/aws
        property: access_key_id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: mantl/compliance/aws
        property: secret_access_key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: compliance-slack-webhook
  namespace: compliance-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: compliance-slack-webhook
    creationPolicy: Owner
  data:
    - secretKey: webhook-url
      remoteRef:
        key: mantl/compliance/slack
        property: webhook_url
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: compliance-pagerduty-key
  namespace: compliance-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: compliance-pagerduty-key
    creationPolicy: Owner
  data:
    - secretKey: routing-key
      remoteRef:
        key: mantl/compliance/pagerduty
        property: routing_key
