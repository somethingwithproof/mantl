# SPDX-License-Identifier: Apache-2.0
# Evidence Collector: Kubernetes Configuration Snapshot
# Collects resource configurations as evidence for SOC2 controls
apiVersion: batch/v1
kind: CronJob
metadata:
  name: compliance-config-snapshot
  namespace: compliance-system
  labels:
    compliance.mantl.io/collector: config-snapshot
spec:
  schedule: "0 0 * * *"  # Daily at midnight
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            compliance.mantl.io/collector: config-snapshot
        spec:
          serviceAccountName: compliance-collector
          restartPolicy: OnFailure
          containers:
            - name: collector
              image: ghcr.io/mantl/compliance-collector:latest
              args:
                - config-snapshot
                - --resources=networkpolicies,clusterroles,clusterrolebindings,serviceaccounts,ingresses,certificates
                - --output=s3://$(EVIDENCE_BUCKET)/config-snapshots/$(DATE)/
                - --hash-algorithm=sha256
                - --sign=true
              env:
                - name: EVIDENCE_BUCKET
                  valueFrom:
                    configMapKeyRef:
                      name: compliance-config
                      key: evidence-bucket
                - name: DATE
                  value: "$(date +%Y-%m-%d)"
                - name: AWS_REGION
                  value: us-east-1
              resources:
                limits:
                  cpu: 500m
                  memory: 512Mi
                requests:
                  cpu: 100m
                  memory: 128Mi
              securityContext:
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: compliance-collector
  namespace: compliance-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: compliance-collector
rules:
  # Read-only access to resources we need to snapshot
  - apiGroups: [""]
    resources: ["namespaces", "serviceaccounts", "secrets", "configmaps"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["get", "list"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates", "issuers", "clusterissuers"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: compliance-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: compliance-collector
subjects:
  - kind: ServiceAccount
    name: compliance-collector
    namespace: compliance-system
