apiVersion: v1
kind: Service
metadata:
  name: compliance-operator
  namespace: compliance-system
  labels:
    app.kubernetes.io/name: compliance-operator
spec:
  selector:
    app.kubernetes.io/name: compliance-operator
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
      protocol: TCP
    - name: health
      port: 8081
      targetPort: health
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: compliance-webhook
  namespace: compliance-system
  labels:
    app.kubernetes.io/name: compliance-operator
spec:
  selector:
    app.kubernetes.io/name: compliance-operator
  ports:
    - name: webhook
      port: 443
      targetPort: 9443
      protocol: TCP
