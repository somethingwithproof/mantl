# Compliance Operator Deployment
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: compliance-system

resources:
  - namespace.yaml
  - crds/
  - rbac/
  - deployment.yaml
  - service.yaml
  - configmap.yaml

images:
  - name: compliance-operator
    newName: ghcr.io/mantl/compliance-operator
    newTag: v0.1.0

configMapGenerator:
  - name: compliance-config
    literals:
      - evidence-bucket=mantl-compliance-evidence
      - log-level=info

labels:
  - pairs:
      app.kubernetes.io/name: compliance-operator
      app.kubernetes.io/component: operator
      app.kubernetes.io/part-of: mantl
