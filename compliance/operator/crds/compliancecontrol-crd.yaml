apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: compliancecontrols.compliance.mantl.io
  annotations:
    description: "Maps regulatory controls to technical implementations"
spec:
  group: compliance.mantl.io
  names:
    kind: ComplianceControl
    listKind: ComplianceControlList
    plural: compliancecontrols
    singular: compliancecontrol
    shortNames:
      - cc
      - control
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - controlId
                - name
                - frameworks
              properties:
                controlId:
                  type: string
                name:
                  type: string
                description:
                  type: string
                guidance:
                  type: string
                category:
                  type: string
                  enum:
                    - Access Control
                    - Audit and Accountability
                    - Configuration Management
                    - Contingency Planning
                    - Identification and Authentication
                    - Incident Response
                    - System and Information Integrity
                frameworks:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - frameworkRef
                      - controlRef
                    properties:
                      frameworkRef:
                        type: string
                      controlRef:
                        type: string
                      sectionRef:
                        type: string
                implementations:
                  type: object
                  properties:
                    kyvernoPolicies:
                      type: array
                      items:
                        type: object
                        required:
                          - name
                        properties:
                          name:
                            type: string
                          weight:
                            type: integer
                            minimum: 1
                            maximum: 100
                            default: 50
                          required:
                            type: boolean
                            default: true
                    falcoRules:
                      type: array
                      items:
                        type: object
                        required:
                          - name
                        properties:
                          name:
                            type: string
                          priority:
                            type: string
                            enum: [Emergency, Alert, Critical, Error, Warning, Notice, Info, Debug]
                            default: Warning
                evidenceRequirements:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - description
                    properties:
                      type:
                        type: string
                        enum: [PolicyReport, AuditLog, ConfigSnapshot, RuntimeAlert, AccessReview, Document, TestResult]
                      description:
                        type: string
                      automated:
                        type: boolean
                        default: true
                      retentionDays:
                        type: integer
                        default: 365
                severity:
                  type: string
                  enum: [Critical, High, Medium, Low]
                  default: Medium
                remediationStrategy:
                  type: string
                  enum: [Audit, Warn, Enforce, AutoFix]
                  default: Enforce
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [NotImplemented, PartiallyImplemented, Implemented, Passing, Failing]
                implementationScore:
                  type: number
                  format: float
                complianceState:
                  type: string
                  enum: [Compliant, NonCompliant, Unknown, NotApplicable]
                lastEvaluated:
                  type: string
                  format: date-time
                evidenceCount:
                  type: integer
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Control ID
          type: string
          jsonPath: .spec.controlId
        - name: Category
          type: string
          jsonPath: .spec.category
        - name: Severity
          type: string
          jsonPath: .spec.severity
        - name: State
          type: string
          jsonPath: .status.complianceState
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
