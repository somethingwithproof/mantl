# SPDX-License-Identifier: Apache-2.0
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: complianceframeworks.compliance.mantl.io
  annotations:
    description: "Aggregate root representing a compliance standard (SOC2, HIPAA, etc.)"
spec:
  group: compliance.mantl.io
  names:
    kind: ComplianceFramework
    listKind: ComplianceFrameworkList
    plural: complianceframeworks
    singular: complianceframework
    shortNames:
      - cf
      - framework
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - name
                - version
                - sections
              properties:
                name:
                  type: string
                  description: "Human-readable framework name"
                version:
                  type: string
                  description: "Framework version"
                description:
                  type: string
                  description: "Framework description and scope"
                authority:
                  type: string
                  description: "Governing body"
                url:
                  type: string
                  description: "Official documentation URL"
                sections:
                  type: array
                  description: "Logical groupings of controls"
                  items:
                    type: object
                    required:
                      - id
                      - name
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      description:
                        type: string
                      controls:
                        type: array
                        items:
                          type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Active, Deprecated]
                  default: Pending
                controlCount:
                  type: integer
                implementedCount:
                  type: integer
                complianceScore:
                  type: number
                  format: float
                lastAssessment:
                  type: string
                  format: date-time
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Version
          type: string
          jsonPath: .spec.version
        - name: Controls
          type: integer
          jsonPath: .status.controlCount
        - name: Score
          type: number
          jsonPath: .status.complianceScore
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
