# SPDX-License-Identifier: Apache-2.0
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: compliancefindings.compliance.mantl.io
  annotations:
    description: "Compliance violations and gaps requiring remediation"
spec:
  group: compliance.mantl.io
  names:
    kind: ComplianceFinding
    listKind: ComplianceFindingList
    plural: compliancefindings
    singular: compliancefinding
    shortNames:
      - cfind
      - finding
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - type
                - controlRef
                - severity
                - title
              properties:
                type:
                  type: string
                  enum: [PolicyViolation, RuntimeAlert, ConfigDrift, MissingControl, ManualFinding]
                controlRef:
                  type: string
                title:
                  type: string
                description:
                  type: string
                severity:
                  type: string
                  enum: [Critical, High, Medium, Low, Info]
                affectedResources:
                  type: array
                  items:
                    type: object
                    properties:
                      apiVersion:
                        type: string
                      kind:
                        type: string
                      name:
                        type: string
                      namespace:
                        type: string
                evidenceRefs:
                  type: array
                  items:
                    type: string
                remediation:
                  type: object
                  properties:
                    description:
                      type: string
                    automated:
                      type: boolean
                    estimatedEffort:
                      type: string
                assignee:
                  type: string
                dueDate:
                  type: string
                  format: date-time
                detectedAt:
                  type: string
                  format: date-time
            status:
              type: object
              properties:
                state:
                  type: string
                  enum: [Open, Acknowledged, InProgress, Remediated, Accepted, FalsePositive, Closed]
                  default: Open
                acknowledgedAt:
                  type: string
                  format: date-time
                resolvedAt:
                  type: string
                  format: date-time
                resolution:
                  type: string
                slaStatus:
                  type: string
                  enum: [OnTrack, AtRisk, Breached]
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: .spec.type
        - name: Severity
          type: string
          jsonPath: .spec.severity
        - name: Control
          type: string
          jsonPath: .spec.controlRef
        - name: State
          type: string
          jsonPath: .status.state
        - name: SLA
          type: string
          jsonPath: .status.slaStatus
