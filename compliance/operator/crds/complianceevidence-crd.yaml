apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: complianceevidences.compliance.mantl.io
  annotations:
    description: "Immutable evidence artifacts for audit trails"
spec:
  group: compliance.mantl.io
  names:
    kind: ComplianceEvidence
    listKind: ComplianceEvidenceList
    plural: complianceevidences
    singular: complianceevidence
    shortNames:
      - ce
      - evidence
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - type
                - controlRef
                - contentHash
                - collectedAt
              properties:
                type:
                  type: string
                  enum: [PolicyReport, AuditLog, ConfigSnapshot, RuntimeAlert, AccessReview, Document, TestResult, ScanResult]
                controlRef:
                  type: string
                frameworkRefs:
                  type: array
                  items:
                    type: string
                description:
                  type: string
                collectedAt:
                  type: string
                  format: date-time
                collectedBy:
                  type: string
                contentHash:
                  type: string
                  description: "SHA-256 hash (content-addressable)"
                  pattern: "^sha256:[a-f0-9]{64}$"
                storage:
                  type: object
                  required:
                    - backend
                    - location
                  properties:
                    backend:
                      type: string
                      enum: [S3, GCS, AzureBlob, InCluster]
                    location:
                      type: string
                    encryptionKey:
                      type: string
                signature:
                  type: object
                  properties:
                    algorithm:
                      type: string
                      enum: [ECDSA-P256, RSA-PSS-2048, Ed25519]
                    value:
                      type: string
                    keyId:
                      type: string
                    signedAt:
                      type: string
                      format: date-time
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Stored, Verified, Corrupted, Expired]
                verified:
                  type: boolean
                verifiedAt:
                  type: string
                  format: date-time
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: .spec.type
        - name: Control
          type: string
          jsonPath: .spec.controlRef
        - name: Collected
          type: date
          jsonPath: .spec.collectedAt
        - name: Phase
          type: string
          jsonPath: .status.phase
