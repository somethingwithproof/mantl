        node-type: memory-optimized
        provisioner: karpenter
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: memory-optimized

      requirements:
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["r"]

        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["6"]

        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["xlarge", "2xlarge", "4xlarge", "8xlarge"]

        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]

        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]

        - key: kubernetes.io/os
          operator: In
          values: ["linux"]

      taints:
        - key: workload-type
          value: memory
          effect: NoSchedule

      expireAfter: 720h

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
    budgets:
      - nodes: "20%"

  limits:
    cpu: 200
    memory: 2000Gi

  weight: 50
---
# NodePool for GPU workloads
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu
  labels:
    app.kubernetes.io/name: nodepool-gpu
    app.kubernetes.io/part-of: mantl-infrastructure
spec:
  template:
    metadata:
      labels:
        node-type: gpu
        provisioner: karpenter
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu

      requirements:
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["g", "p"]

        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["4"]

        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]

        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]

        - key: kubernetes.io/os
          operator: In
          values: ["linux"]

      taints:
        - key: nvidia.com/gpu
          value: "true"
          effect: NoSchedule

      expireAfter: 720h

  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 10m
    budgets:
      - nodes: "10%"

  limits:
    cpu: 100
    memory: 500Gi
    nvidia.com/gpu: 20

  weight: 10
---
# NodePool for Spot instances (cost optimization)
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: spot
  labels:
    app.kubernetes.io/name: nodepool-spot
    app.kubernetes.io/part-of: mantl-infrastructure
spec:
  template:
    metadata:
      labels:
        node-type: spot
        provisioner: karpenter
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default

      requirements:
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]

        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]

        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["medium", "large", "xlarge", "2xlarge", "4xlarge"]

        - key: kubernetes.io/arch
          operator: In
          values: ["amd64", "arm64"]

        # Only Spot instances
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]

        - key: kubernetes.io/os
          operator: In
          values: ["linux"]

      taints:
        - key: spot
          value: "true"
          effect: PreferNoSchedule

      expireAfter: 168h  # 7 days for spot instances

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
    budgets:
      - nodes: "50%"  # More aggressive for spot

  limits:
    cpu: 500
    memory: 1000Gi

  weight: 200  # Prefer spot for cost savings
