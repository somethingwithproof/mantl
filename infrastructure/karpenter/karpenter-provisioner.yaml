# Karpenter Node Provisioner Configuration
# Just-in-time node provisioning for Kubernetes
# https://karpenter.sh/

---
# NodePool for general workloads
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
  labels:
    app.kubernetes.io/name: nodepool-default
    app.kubernetes.io/part-of: mantl-infrastructure
spec:
  # Template for provisioned nodes
  template:
    metadata:
      labels:
        node-type: default
        provisioner: karpenter
    spec:
      # Reference to EC2NodeClass
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default

      # Requirements for node selection
      requirements:
        # Instance category (general purpose, compute optimized, memory optimized)
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]

        # Instance generation (prefer newer generations)
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]

        # Instance sizes
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["medium", "large", "xlarge", "2xlarge"]

        # CPU architecture
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64", "arm64"]

        # Capacity type (on-demand vs spot)
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand", "spot"]

        # Operating system
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]

      # Expiry and disruption settings
      expireAfter: 720h  # 30 days

  # Disruption settings
  disruption:
    # Consolidation policy
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m

    # Budget for disruption operations
    budgets:
      - nodes: "10%"

  # Resource limits
  limits:
    cpu: 1000
    memory: 2000Gi

  # Weight for scheduling preference
  weight: 100
---
# NodePool for compute-intensive workloads
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: compute-optimized
  labels:
    app.kubernetes.io/name: nodepool-compute-optimized
    app.kubernetes.io/part-of: mantl-infrastructure
spec:
  template:
    metadata:
      labels:
        node-type: compute-optimized
        provisioner: karpenter
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: compute-optimized

      requirements:
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c"]

        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["6"]

        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["xlarge", "2xlarge", "4xlarge", "8xlarge"]

        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]

        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]

        - key: kubernetes.io/os
          operator: In
          values: ["linux"]

      # Taints to ensure only compute workloads land here
      taints:
        - key: workload-type
          value: compute
          effect: NoSchedule

      expireAfter: 720h

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
    budgets:
      - nodes: "20%"

  limits:
    cpu: 500
    memory: 1000Gi

  weight: 50
---
