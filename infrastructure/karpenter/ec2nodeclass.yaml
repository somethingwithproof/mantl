# EC2NodeClass for GPU workloads
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu
  labels:
    app.kubernetes.io/name: ec2nodeclass-gpu
    app.kubernetes.io/part-of: mantl-infrastructure
spec:
  # Use NVIDIA GPU-optimized AMI
  amiSelectorTerms:
    - alias: al2023@latest  # AL2023 with GPU support

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "${CLUSTER_NAME}"
        kubernetes.io/role/internal-elb: "1"

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "${CLUSTER_NAME}"

  instanceProfile: "KarpenterNodeInstanceProfile-${CLUSTER_NAME}"

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 500Gi  # Larger disk for GPU workloads
        volumeType: gp3
        iops: 10000
        throughput: 500
        encrypted: true
        deleteOnTermination: true

  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required

  detailedMonitoring: true

  # Install NVIDIA device plugin
  userData: |
    #!/bin/bash
    set -ex

    # Install NVIDIA drivers if not present
    if ! command -v nvidia-smi &> /dev/null; then
      yum install -y nvidia-driver-latest-dkms
    fi

    # Configure nvidia-container-runtime
    cat <<EOF > /etc/nvidia-container-runtime/config.toml
    disable-require = false
    [nvidia-container-cli]
    environment = []
    EOF

    # Configure containerd for GPU
    cat <<EOF > /etc/containerd/config.toml
    version = 2
    [plugins."io.containerd.grpc.v1.cri"]
      [plugins."io.containerd.grpc.v1.cri".containerd]
        default_runtime_name = "nvidia"
        [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.nvidia]
          runtime_type = "io.containerd.runc.v2"
          [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.nvidia.options]
            BinaryName = "/usr/bin/nvidia-container-runtime"
            SystemdCgroup = true
    EOF

  tags:
    Name: "karpenter-${CLUSTER_NAME}-gpu"
    Environment: production
    ManagedBy: karpenter
    Platform: mantl
    WorkloadType: gpu
---
