# Kyverno Security Policies Kustomization
# Kubernetes-native policy management
# https://kyverno.io/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: kyverno-security-policies
  labels:
    app.kubernetes.io/name: kyverno-security-policies
    app.kubernetes.io/part-of: mantl-platform

namespace: kyverno

resources:
  - cluster-policies.yaml

# Helm chart for Kyverno itself
helmCharts:
  - name: kyverno
    repo: https://kyverno.github.io/kyverno
    version: 3.1.0
    releaseName: kyverno
    namespace: kyverno
    valuesFile: kyverno-values.yaml
    includeCRDs: true

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  platform.mantl.io/component: kyverno
  security.mantl.io/policy-engine: kyverno

# Common annotations for all resources
commonAnnotations:
  mantl.io/security-component: "policy-enforcement"
  mantl.io/documentation: "https://kyverno.io/docs/"
