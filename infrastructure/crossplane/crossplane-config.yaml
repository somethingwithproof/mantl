---
# AWS ProviderConfig - configure credentials source
# Uses IRSA (IAM Roles for Service Accounts) for secure authentication
apiVersion: aws.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
  labels:
    app.kubernetes.io/name: aws-provider-config
    app.kubernetes.io/part-of: mantl-infrastructure
spec:
  credentials:
    source: IRSA
  # Alternative: Use Secret for credentials
  # credentials:
  #   source: Secret
  #   secretRef:
  #     namespace: crossplane-system
  #     name: aws-credentials
  #     key: credentials
---
# GCP ProviderConfig - configure credentials source
# Uses Workload Identity for secure authentication
apiVersion: gcp.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
  labels:
    app.kubernetes.io/name: gcp-provider-config
    app.kubernetes.io/part-of: mantl-infrastructure
spec:
  projectID: ""  # Set via environment overlay
  credentials:
    source: InjectedIdentity
  # Alternative: Use Secret for credentials
  # credentials:
  #   source: Secret
  #   secretRef:
  #     namespace: crossplane-system
  #     name: gcp-credentials
  #     key: credentials.json
---
# Azure ProviderConfig - configure credentials source
# Uses Workload Identity for secure authentication
apiVersion: azure.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
  labels:
    app.kubernetes.io/name: azure-provider-config
    app.kubernetes.io/part-of: mantl-infrastructure
spec:
  credentials:
    source: OIDCTokenFile
  subscriptionID: ""  # Set via environment overlay
  tenantID: ""        # Set via environment overlay
  # Alternative: Use Secret for credentials
  # credentials:
  #   source: Secret
  #   secretRef:
  #     namespace: crossplane-system
  #     name: azure-credentials
  #     key: credentials
