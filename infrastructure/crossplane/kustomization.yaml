# Crossplane Infrastructure Resources Kustomization
# Apply after Crossplane is installed and providers are healthy
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: crossplane-infrastructure
  labels:
    app.kubernetes.io/name: crossplane-infrastructure
    app.kubernetes.io/part-of: mantl-platform

resources:
  - crossplane-config.yaml
  - xrd-network.yaml
  - xrd-database.yaml
  - xrd-kubernetes-cluster.yaml

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  platform.mantl.io/component: crossplane
