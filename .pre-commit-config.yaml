---
# Vendored Helm charts, terraform provider caches, generated code, legacy
# artifacts, and example-app sources are not first-party and must not be linted
# here. Scoping the hooks to first-party files keeps the run fast and
# meaningful.
exclude: |
  (?x)^(
    platform/.*|
    policies/kyverno/charts/.*|
    .*/\.terraform/.*|
    .*/templates/.*|
    examples/.*/(src|node_modules|build)/.*|
    docs/legacy/.*|
    .*/zz_generated\..*
  )$

repos:
  # Local hooks
  - repo: local
    hooks:
      - id: kyverno-no-placeholders
        name: kyverno-no-placeholders
        entry: ci/check-placeholders.sh
        language: system
        pass_filenames: false
      - id: trivy-config
        name: trivy-config
        # Terraform module fetches must not inherit the committing worktree's index.
        entry: env -u GIT_INDEX_FILE -u GIT_DIR -u GIT_WORK_TREE trivy config --severity HIGH,CRITICAL .
        language: system
        pass_filenames: false

  # Secret detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package-lock\.json|go\.sum

  # Python formatting
  - repo: https://github.com/psf/black
    rev: 25.12.0
    hooks:
      - id: black
        args: ["--line-length=100"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        args: ["--fix"]

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: ["-s"]

  # General pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        # Release Please owns this generated file and writes JSON without a newline.
        exclude: ^\.release-please-manifest\.json$
      - id: trailing-whitespace
      - id: check-yaml
        args: ['--unsafe']
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending

  # Terraform
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.99.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      - id: terraform_tflint
        args:
          - '--args=--only=terraform_deprecated_interpolation'
          - '--args=--only=terraform_deprecated_index'
          - '--args=--only=terraform_unused_declarations'
          - '--args=--only=terraform_module_pinned_source'
      - id: terraform_docs
        args:
          - --hook-config=--path-to-file=README.md
          - --hook-config=--add-to-existing-file=true
          - --hook-config=--create-file-if-not-exist=true

  # Commit message validation
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.2.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]
        files: \.(sh|bash)$
