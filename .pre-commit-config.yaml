repos:
  # Security and quality checks (local)
  - repo: local
    hooks:
      - id: kyverno-no-placeholders
        name: kyverno-no-placeholders
        entry: ci/check-placeholders.sh
        language: system
        pass_filenames: false

      - id: kyverno-validate
        name: kyverno-validate-policies
        entry: bash -c 'command -v kyverno >/dev/null 2>&1 && find policies/kyverno -name "*.yaml" -type f | xargs -I {} kyverno validate {} || echo "Kyverno CLI not installed, skipping validation"'
        language: system
        pass_filenames: false
        files: ^policies/kyverno/.*\.yaml$

      - id: pytest-check
        name: pytest-fast-tests
        entry: bash -c 'pytest tests/unit -v --tb=short -m "not slow" || true'
        language: system
        pass_filenames: false
        files: ^(tests/.*\.py|.*\.py)$

      - id: no-commit-to-main
        name: no-commit-to-main
        entry: bash -c 'if [ "$(git rev-parse --abbrev-ref HEAD)" = "main" ]; then echo "ERROR: Direct commits to main branch are not allowed. Use a feature branch."; exit 1; fi'
        language: system
        pass_filenames: false
        stages: [commit]
- repo: https://github.com/psf/black
    rev: 25.12.0
    hooks:
      - id: black
        args: ["--line-length=100"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        args: ["--fix"]
- repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: ["-s"]
  - repo: https://github.com/ansible/ansible-lint
    rev: v25.12.2
    hooks:
      - id: ansible-lint
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.99.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.2.0
    hooks:
      - id: commitizen
        stages: [commit-msg]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]
        files: ^scripts/.*\.sh$
  - repo: https://github.com/terraform-docs/terraform-docs
    rev: v0.19.0
    hooks:
      - id: terraform-docs-go
        args: ["markdown", "table", "--output-file", "README.md", "."]
        files: ^terraform/.*
