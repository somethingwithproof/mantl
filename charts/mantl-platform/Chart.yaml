apiVersion: v2
name: mantl-platform
description: Complete platform stack for production Kubernetes with monitoring, backup, security, and cost management
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - platform
  - kubernetes
  - monitoring
  - backup
  - security
  - cost-management
home: https://github.com/thomasvincent/mantl
sources:
  - https://github.com/thomasvincent/mantl
maintainers:
  - name: mantl
    email: maintainers@mantl.io

dependencies:
  # Monitoring Stack
  - name: kube-prometheus-stack
    version: "~56.0.0"
    repository: https://prometheus-community.github.io/helm-charts
    condition: monitoring.enabled
    alias: prometheus

  - name: grafana
    version: "~7.3.0"
    repository: https://grafana.github.io/helm-charts
    condition: monitoring.grafana.enabled

  # Backup & DR
  - name: velero
    version: "~5.3.0"
    repository: https://vmware-tanzu.github.io/helm-charts
    condition: backup.velero.enabled

  # Security
  - name: trivy-operator
    version: "~0.20.0"
    repository: https://aquasecurity.github.io/helm-charts
    condition: security.trivy.enabled

  - name: falco
    version: "~4.0.0"
    repository: https://falcosecurity.github.io/charts
    condition: security.falco.enabled

  # Database
  - name: cloudnative-pg
    version: "~0.20.0"
    repository: https://cloudnative-pg.github.io/charts
    condition: database.enabled
    alias: cnpg

  # Progressive Delivery
  - name: flagger
    version: "~1.35.0"
    repository: https://flagger.app
    condition: progressiveDelivery.enabled

  # Cost Management
  - name: opencost
    version: "~1.26.0"
    repository: https://opencost.github.io/opencost-helm-chart
    condition: cost.enabled

  # Chaos Engineering
  - name: chaos-mesh
    version: "~2.6.0"
    repository: https://charts.chaos-mesh.org
    condition: chaos.enabled

  # Developer Platform
  - name: backstage
    version: "~1.8.0"
    repository: https://backstage.github.io/charts
    condition: developer.backstage.enabled

  # Virtual Clusters
  - name: vcluster
    version: "~0.19.0"
    repository: https://charts.loft.sh
    condition: developer.vcluster.enabled
