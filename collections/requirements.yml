---
# Ansible Collections Requirements for Mantl Platform
# Compatible with Ansible 13.x (ansible-core 2.17+)
# Install with: ansible-galaxy collection install -r collections/requirements.yml

collections:
  # Cloud Provider Collections
  - name: amazon.aws
    version: ">=8.0.0"

  - name: google.cloud
    version: ">=3.0.0"

  - name: azure.azcollection
    version: ">=3.0.0"

  - name: oracle.oci
    version: ">=6.0.0"

  - name: community.digitalocean
    version: ">=1.27.0"

  # Kubernetes & Container Collections
  - name: kubernetes.core
    version: ">=5.0.0"

  - name: community.docker
    version: ">=4.0.0"

  - name: community.general
    version: ">=10.0.0"

  # Network & DNS Collections
  - name: community.dns
    version: ">=3.0.0"

  # System & Infrastructure
  - name: ansible.posix
    version: ">=1.6.0"

  - name: ansible.utils
    version: ">=5.0.0"

  # Security & Secrets Management
  - name: community.crypto
    version: ">=2.21.0"

  - name: community.sops
    version: ">=2.0.0"

  # Monitoring & Observability
  - name: community.grafana
    version: ">=2.0.0"

  - name: prometheus.prometheus
    version: ">=1.0.0"

  # GitOps & CD
  - name: community.hashi_vault
    version: ">=6.0.0"
