apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api-service
  labels:
    app.kubernetes.io/name: api-service
    app.kubernetes.io/component: backend
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: api-service
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
