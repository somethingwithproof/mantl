apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonLabels:
  app.kubernetes.io/managed-by: mantl
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
configMapGenerator:
  - name: app-config
    behavior: create
  - name: web-domain
    literals:
      - domain=app.example.com
replacements:
  - source:
      kind: ConfigMap
      name: web-domain
      fieldPath: data.domain
    targets:
      - select:
          kind: Ingress
          name: app
        fieldPaths:
          - spec.rules.0.host
        options:
          create: false
