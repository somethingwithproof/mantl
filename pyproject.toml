[build-system]
requires = []

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '(docs/_build|legacy|\.git|build|dist)'

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E","F","I","B","UP","SIM"]
exclude = ["docs/_build","legacy","build","dist"]

[tool.coverage.run]
source = ["."]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/dist/*",
    "*/build/*",
    "*/.venv/*",
    "*/venv/*",
    "setup.py",
    "conftest.py",
    "docs/*",
    "legacy/*",
]
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
# No Python application is under test (the suite validates infra files), so the
# default invocation does not collect coverage. Keep the gate at 0 to avoid a
# false failure if someone runs `pytest --cov`; raise it once Python sources
# with real coverage exist.
fail_under = 0
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
ignore_missing_imports = true
local_partial_types = true
strict_bytes = true
allow_redefinition = false
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
strict_optional = true
disallow_untyped_defs = false
check_untyped_defs = true
