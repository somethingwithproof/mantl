[build-system]
requires = []

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '(docs/_build|legacy|\.git|build|dist)'

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E","F","I","B","UP","SIM"]
exclude = ["docs/_build","legacy","build","dist"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# Removed -q for better visibility, increased maxfail for debugging
addopts = "-v --maxfail=5 --tb=short --strict-markers"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "requires_docker: marks tests that require Docker",
    "requires_kubernetes: marks tests that require a Kubernetes cluster",
    "requires_helm: marks tests that require Helm CLI",
    "requires_kustomize: marks tests that require Kustomize CLI",
    "requires_argocd: marks tests that require ArgoCD CLI",
    "yaml_validation: marks tests that validate YAML manifests",
    "shell_scripts: marks tests that validate shell scripts",
    "security: marks security-related tests",
    "network_policies: marks network policy tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
# Collect test durations for optimization
durations = 10
durations_min = 0.1

[tool.coverage.run]
source = ["."]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/dist/*",
    "*/build/*",
    "*/.venv/*",
    "*/venv/*",
    "setup.py",
    "conftest.py",
    "docs/*",
    "legacy/*",
]
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
fail_under = 70
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
strict_optional = true
disallow_untyped_defs = false
check_untyped_defs = true
