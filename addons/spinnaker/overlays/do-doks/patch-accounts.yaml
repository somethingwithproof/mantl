apiVersion: spinnaker.io/v1alpha2
kind: SpinnakerService
metadata:
  name: spinnaker
spec:
  spinnakerConfig:
    config:
      providers:
        kubernetes:
          accounts:
            - name: doks-staging
              namespaces: ["staging"]
              serviceAccount: spin-sa
            - name: doks-prod
              namespaces: ["prod"]
              serviceAccount: spin-sa
          primaryAccount: doks-staging