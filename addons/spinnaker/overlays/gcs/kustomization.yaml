apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: spinnaker
resources:
  - ../../base
patches:
  - path: patch-gcs.yaml

# Generate a Secret named front50-gcs from a local service account JSON file
# Create gcs-service-account.json in this directory (do NOT commit) and kustomize will load it.
secretGenerator:
  - name: front50-gcs
    namespace: spinnaker
    files:
      - service-account.json=gcs-service-account.json
  - name: github-artifacts
    namespace: spinnaker
    envs:
      - github.env

generatorOptions:
  disableNameSuffixHash: true
