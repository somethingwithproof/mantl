apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliance-operator-controller-manager
  namespace: mantl-compliance-system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: mantl-compliance
    app.kubernetes.io/part-of: mantl
    app.kubernetes.io/version: development
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: mantl-compliance
        app.kubernetes.io/part-of: mantl
        app.kubernetes.io/version: development
        app.kubernetes.io/managed-by: kustomize
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - command:
            - /manager
          args:
            - --leader-elect
            - --framework-dir=/etc/compliance/frameworks
            - --collector-image=mantl-compliance-operator:development
            - --evidence-bucket=$(EVIDENCE_BUCKET)
            - --evidence-kms-key=$(EVIDENCE_KMS_KEY)
          env:
            - name: EVIDENCE_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: evidence-storage
                  key: bucket
            - name: EVIDENCE_KMS_KEY
              valueFrom:
                configMapKeyRef:
                  name: evidence-storage
                  key: kms-key
          image: mantl-compliance-operator:development
          name: manager
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
      serviceAccountName: compliance-operator-controller-manager
      terminationGracePeriodSeconds: 10
