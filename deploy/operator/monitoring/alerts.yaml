# SPDX-License-Identifier: Apache-2.0
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mantl-compliance
  namespace: mantl-compliance-system
spec:
  groups:
    - name: mantl-compliance
      rules:
        - alert: MantlReportWatchDisabled
          expr: mantl_compliance_report_watch_ready == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: Install Kyverno CRDs and restart the compliance operator
        - alert: MantlEvidenceMissingOrStale
          expr: mantl_compliance_evidence_age_seconds < 0 or mantl_compliance_evidence_age_seconds > 172800
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: Mantl evidence is missing or older than two days
        - alert: MantlComplianceCoverageGap
          expr: mantl_compliance_coverage_gaps > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Mantl controls have unresolved policies or collectors
        - alert: MantlComplianceAuditFailed
          expr: mantl_compliance_audits_failed > 0 or mantl_compliance_monitor_error > 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: Mantl audit or metadata inspection is failing
