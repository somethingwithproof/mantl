apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fleet-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mantl-fleet
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              mantl.io/fleet-client: 'true'
      ports:
        - port: 8443
          protocol: TCP
