apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# CRDs for the compliance operator, generated by `make manifests` from the
# kubebuilder markers in apis/compliance/v1alpha1. Do not hand-edit the bases.
resources:
  - bases/compliance.mantl.io_complianceprofiles.yaml
  - bases/compliance.mantl.io_findings.yaml
  - bases/compliance.mantl.io_complianceaudits.yaml
  - bases/compliance.mantl.io_auditruns.yaml
  - bases/compliance.mantl.io_controlevaluations.yaml
  - bases/compliance.mantl.io_complianceexceptions.yaml
