apiVersion: v1
kind: ConfigMap
metadata:
  name: hpa-adjuster
  namespace: automation
data:
  adjust.sh: |
    #!/bin/bash
    # Auto-adjust HPA based on time of day and load patterns

    HOUR=$(date +%H)
    DAY=$(date +%u)  # 1=Monday, 7=Sunday

    # Business hours: Scale up
    if [ $DAY -le 5 ] && [ $HOUR -ge 9 ] && [ $HOUR -le 18 ]; then
      MIN_REPLICAS=5
      MAX_REPLICAS=20
    # After hours: Scale down
    else
      MIN_REPLICAS=2
      MAX_REPLICAS=10
    fi

    # Update all HPAs in production
    kubectl get hpa -n production -o name | while read hpa; do
      echo "[$(date)] Adjusting $hpa: min=$MIN_REPLICAS, max=$MAX_REPLICAS"

      kubectl patch $hpa -n production --type merge -p "{
        \"spec\": {
          \"minReplicas\": $MIN_REPLICAS,
          \"maxReplicas\": $MAX_REPLICAS
        }
      }"
    done
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hpa-adjuster
  namespace: automation
spec:
  schedule: "0 * * * *"  # Every hour
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: automation-sa
          containers:
          - name: adjuster
            image: bitnami/kubectl:latest
            command: ["/bin/bash", "/scripts/adjust.sh"]
            volumeMounts:
            - name: scripts
              mountPath: /scripts
          volumes:
          - name: scripts
            configMap:
              name: hpa-adjuster
              defaultMode: 0755
          restartPolicy: OnFailure
