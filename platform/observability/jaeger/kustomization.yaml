# CNCF Graduated: Jaeger
# https://www.jaegertracing.io/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability

resources:
  - namespace.yaml

helmCharts:
  - name: jaeger
    repo: https://jaegertracing.github.io/helm-charts
    version: 3.3.1
    releaseName: jaeger
    namespace: observability
    valuesFile: values.yaml
