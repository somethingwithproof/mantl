apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - ../../base
patches:
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: kube-prometheus-stack-values
        namespace: monitoring
      data:
        values.yaml: |
          # Staging environment - production-like configuration
          prometheus:
            prometheusSpec:
              replicas: 2
              retention: 15d
              retentionSize: 30GB
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: 2000m
                  memory: 4Gi
              storageSpec:
                volumeClaimTemplate:
                  spec:
                    accessModes: ["ReadWriteOnce"]
                    resources:
                      requests:
                        storage: 50Gi

          alertmanager:
            alertmanagerSpec:
              replicas: 2
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi

          grafana:
            enabled: true
            replicas: 1
            resources:
              requests:
                cpu: 200m
                memory: 256Mi
              limits:
                cpu: 1000m
                memory: 1Gi

          # Node exporter
          nodeExporter:
            enabled: true

          # Kube state metrics
          kubeStateMetrics:
            enabled: true

          # Enable servicemonitors for additional services
          kubeScheduler:
            enabled: true
          kubeControllerManager:
            enabled: true
          kubeEtcd:
            enabled: true
