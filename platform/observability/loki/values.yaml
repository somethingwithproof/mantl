# Grafana Loki Helm values
# Log aggregation for Kubernetes
# https://grafana.com/docs/loki/latest/

# Deployment mode: single binary for simplicity, scalable for production
deploymentMode: SimpleScalable

# Loki configuration
loki:
  auth_enabled: false
  
  # Schema and storage
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  
  # Storage configuration (filesystem for on-prem, S3/GCS for cloud)
  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules
  
  # Uncomment for S3 storage:
  # storage:
  #   type: s3
  #   s3:
  #     endpoint: s3.amazonaws.com
  #     region: us-east-1
  #     bucketnames: loki-chunks
  #     access_key_id: ${AWS_ACCESS_KEY_ID}
  #     secret_access_key: ${AWS_SECRET_ACCESS_KEY}
  
  # Limits
  limits_config:
    retention_period: 744h  # 31 days
    ingestion_rate_mb: 10
    ingestion_burst_size_mb: 20
    max_query_series: 500
    max_query_parallelism: 32
    max_streams_per_user: 10000
    max_line_size: 256kb
  
  # Compactor for retention
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    retention_delete_delay: 2h
    delete_request_store: filesystem
  
  # Common config
  commonConfig:
    replication_factor: 1  # Increase for HA
  
  # Query settings
  query_scheduler:
    max_outstanding_requests_per_tenant: 32768
  
  # Ruler for alerting (optional)
  rulerConfig:
    storage:
      type: local
      local:
        directory: /var/loki/rules
    rule_path: /var/loki/scratch
    alertmanager_url: http://prometheus-alertmanager.monitoring.svc.cluster.local:9093
    ring:
      kvstore:
        store: inmemory
    enable_api: true

# Simple Scalable deployment
read:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

write:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    size: 10Gi

backend:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    size: 10Gi

# Gateway (nginx)
gateway:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Disable unused components
singleBinary:
  replicas: 0

# Monitoring
monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: prometheus
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  lokiCanary:
    enabled: false

# Test disabled
test:
  enabled: false

# Chunk cache (optional, improves query performance)
chunksCache:
  enabled: true
  allocatedMemory: 1024

# Results cache
resultsCache:
  enabled: true
  allocatedMemory: 512
