apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-platform-health
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  platform-health.json: |-
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "gnetId": null,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "title": "ArgoCD Application Sync Status",
          "type": "stat",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "count(argocd_app_info{sync_status=\"Synced\"})",
              "legendFormat": "Synced Apps"
            }
          ]
        },
        {
          "title": "Kyverno Policy Violations",
          "type": "gauge",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "sum(kyverno_policy_results_total{result=\"fail\"})",
              "legendFormat": "Violations"
            }
          ]
        },
        {
          "title": "Cluster Resource Usage (CPU)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "sum(node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate)",
              "legendFormat": "CPU Usage"
            }
          ]
        }
      ],
      "schemaVersion": 36,
      "style": "dark",
      "tags": ["mantl", "platform"],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "title": "Mantl Platform Health",
      "uid": "mantl-health"
    }
