apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: pod-failure-test
  namespace: chaos-mesh
spec:
  action: pod-failure
  mode: one  # one, all, fixed, fixed-percent, random-max-percent
  selector:
    namespaces:
      - staging
    labelSelectors:
      app: api-service
  scheduler:
    cron: "@weekly"  # Run weekly for chaos drills
  duration: "30s"
