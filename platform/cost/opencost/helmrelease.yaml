apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: opencost
  namespace: opencost
spec:
  interval: 30m
  chart:
    spec:
      chart: opencost
      version: "1.39.x"
      sourceRef:
        kind: HelmRepository
        name: opencost
        namespace: flux-system
      interval: 12h

  install:
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3

  valuesFrom:
    - kind: ConfigMap
      name: opencost-config
      valuesKey: values.yaml

  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: opencost
            patch: |
              - op: add
                path: /spec/template/spec/securityContext
                value:
                  runAsNonRoot: true
                  runAsUser: 1000
                  fsGroup: 1000
                  seccompProfile:
                    type: RuntimeDefault
