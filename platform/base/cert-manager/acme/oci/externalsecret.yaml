apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: oci-credentials
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: oci-credentials
    creationPolicy: Owner
  data:
    - secretKey: oci-config
      remoteRef:
        key: cert-manager/oci
        property: oci_config
