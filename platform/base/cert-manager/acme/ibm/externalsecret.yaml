apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ibmcloud-credentials
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: ibmcloud-credentials
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: cert-manager/ibmcloud
        property: api_key
