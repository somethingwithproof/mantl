# Let's Encrypt Production ClusterIssuer
# Use for production certificates trusted by all browsers
# Rate limits: 50 certificates per week per domain
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: cluster-issuer
spec:
  acme:
    # Production endpoint (trusted certificates)
    server: https://acme-v02.api.letsencrypt.org/directory
    
    # Email for certificate expiration notifications
    # IMPORTANT: Replace with your email
    email: admin@example.com
    
    # Secret to store the ACME account private key
    privateKeySecretRef:
      name: letsencrypt-production-account-key
    
    # Enable challenge solvers
    solvers:
      # HTTP-01 solver for standard certificates
      - http01:
          ingress:
            ingressClassName: cilium
        selector: {}
      
      # DNS-01 solver for wildcard certificates
      # Uncomment and configure for your DNS provider
      # - dns01:
      #     route53:
      #       region: us-east-1
      #       # Use IRSA - no credentials needed if IAM role is configured
      #     selector:
      #       dnsZones:
      #         - "example.com"
