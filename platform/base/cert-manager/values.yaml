# cert-manager Helm values
# CNCF Graduated certificate management
# https://cert-manager.io/docs/configuration/

# Install CRDs with Helm
crds:
  enabled: true
  keep: true

# Controller replicas
replicaCount: 2

# Resources
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Prometheus metrics
prometheus:
  enabled: true
  servicemonitor:
    enabled: true
    labels:
      release: prometheus

# Webhook
webhook:
  replicaCount: 2
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# CA Injector
cainjector:
  replicaCount: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# Startup API check
startupapicheck:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi

# Security context
securityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# Feature gates
featureGates: "AdditionalCertificateOutputFormats=true"

# DNS policy
dns01RecursiveNameserversOnly: true
dns01RecursiveNameservers: "8.8.8.8:53,1.1.1.1:53"
