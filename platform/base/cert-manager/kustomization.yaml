# cert-manager - CNCF Graduated
# https://cert-manager.io/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cert-manager

resources:
  - namespace.yaml
  # Base ClusterIssuers (self-signed + Let's Encrypt)
  - cluster-issuers/self-signed.yaml
  - cluster-issuers/letsencrypt-staging.yaml
  - cluster-issuers/letsencrypt-production.yaml
  # Provider-specific issuers - uncomment one:
  # - cluster-issuers/aws-route53.yaml
  # - cluster-issuers/gcp-cloud-dns.yaml
  # - cluster-issuers/azure-dns.yaml
  # - cluster-issuers/cloudflare.yaml

helmCharts:
  - name: cert-manager
    repo: https://charts.jetstack.io
    version: v1.16.2
    releaseName: cert-manager
    namespace: cert-manager
    valuesFile: values.yaml
