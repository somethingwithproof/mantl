# Cilium CNI - CNCF Graduated
# https://cilium.io/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - l2-announcement.yaml

helmCharts:
  - name: cilium
    repo: https://helm.cilium.io/
    version: 1.16.5
    releaseName: cilium
    namespace: kube-system
    valuesFile: values.yaml
