# Example HTTPRoute for the hello application
# Routes traffic to the hello service
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello-route
  namespace: default
  labels:
    app.kubernetes.io/name: hello
    app.kubernetes.io/component: route
spec:
  parentRefs:
    - name: main-gateway
      sectionName: https
  hostnames:
    - "hello.example.com"  # CHANGE THIS
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hello
          port: 80
