# Example Canary Deployment Route
# Splits traffic between stable and canary versions
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: canary-route
  namespace: default
  labels:
    app.kubernetes.io/name: canary-example
    app.kubernetes.io/component: route
spec:
  parentRefs:
    - name: main-gateway
      sectionName: https
  hostnames:
    - "app.example.com"  # CHANGE THIS
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # 90% to stable
        - name: app-stable
          port: 80
          weight: 90
        # 10% to canary
        - name: app-canary
          port: 80
          weight: 10
