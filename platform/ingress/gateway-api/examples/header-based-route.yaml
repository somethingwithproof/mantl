# Example Header-Based Routing
# Routes based on request headers (useful for testing)
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: header-based-route
  namespace: default
  labels:
    app.kubernetes.io/name: header-routing-example
    app.kubernetes.io/component: route
spec:
  parentRefs:
    - name: main-gateway
      sectionName: https
  hostnames:
    - "app.example.com"  # CHANGE THIS
  rules:
    # Route to v2 if X-Version: v2 header is present
    - matches:
        - headers:
            - name: X-Version
              value: v2
      backendRefs:
        - name: app-v2
          port: 80
    
    # Default route to v1
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: app-v1
          port: 80
