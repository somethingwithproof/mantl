# Default Gateway for HTTP/HTTPS traffic
# Creates listeners on ports 80 and 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main-gateway
  namespace: default
  labels:
    app.kubernetes.io/name: main-gateway
    app.kubernetes.io/component: gateway
  annotations:
    # Use cert-manager for TLS certificates
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  gatewayClassName: cilium
  listeners:
    # HTTP listener - redirects to HTTPS
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    
    # HTTPS listener with TLS termination
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: main-gateway-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: All
