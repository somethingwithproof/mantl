# CNCF Graduated: Harbor
# Enterprise container registry with scanning and signing
# https://goharbor.io/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: harbor

resources:
  - namespace.yaml

helmCharts:
  - name: harbor
    repo: https://helm.goharbor.io
    version: 1.16.0
    releaseName: harbor
    namespace: harbor
    valuesFile: values.yaml
