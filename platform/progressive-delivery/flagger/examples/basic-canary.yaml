apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: api-service-canary
  namespace: production
spec:
  # Target deployment
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-service

  # Service configuration
  service:
    port: 8080
    targetPort: 8080
    # Gateway API HTTPRoute reference
    gateways:
      - public-gateway.gateway-api.svc.cluster.local

  # Canary analysis
  analysis:
    # Check interval
    interval: 1m
    # Max traffic percentage routed to canary
    maxWeight: 50
    # Canary increment step
    stepWeight: 10
    # Number of failed checks before rollback
    threshold: 5

    # Metrics for automated promotion/rollback
    metrics:
      - name: request-success-rate
        # Minimum req success rate (non 5xx responses)
        thresholdRange:
          min: 99
        interval: 1m

      - name: request-duration
        # Maximum req duration P99
        thresholdRange:
          max: 500
        interval: 1m

    # Webhook tests (optional)
    webhooks:
      - name: acceptance-test
        type: pre-rollout
        url: http://flagger-loadtester.flagger/
        timeout: 30s
        metadata:
          type: bash
          cmd: "curl -sd 'test' http://api-service-canary.production:8080/token | grep token"

      - name: load-test
        url: http://flagger-loadtester.flagger/
        timeout: 5s
        metadata:
          cmd: "hey -z 1m -q 10 -c 2 http://api-service-canary.production:8080/"

  # Autoscaler integration (optional)
  autoscalerRef:
    apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    name: api-service
