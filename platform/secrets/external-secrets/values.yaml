# External Secrets Operator Helm values
# CNCF Graduated secrets management
# https://external-secrets.io/latest/introduction/overview/

# Controller
replicaCount: 2

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

# Webhook
webhook:
  replicaCount: 2
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# Cert Controller
certController:
  replicaCount: 2
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Prometheus metrics
serviceMonitor:
  enabled: true
  labels:
    release: prometheus

# Security context
securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# CRDs
crds:
  createClusterExternalSecret: true
  createClusterSecretStore: true
  createPushSecret: true

# Concurrent reconciles
concurrent: 5

# Logging
log:
  level: info
  timeEncoding: iso8601
