# Azure Key Vault ClusterSecretStore
# Prerequisites:
# 1. Create Azure Key Vault
# 2. Enable Azure AD Workload Identity on AKS
# 3. Create User-Assigned Managed Identity with Key Vault access
# 4. Federate identity with K8s service account
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: azure-key-vault
spec:
  provider:
    azurekv:
      tenantId: YOUR_TENANT_ID  # Change this
      vaultUrl: https://YOUR_VAULT_NAME.vault.azure.net  # Change this
      authType: WorkloadIdentity
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
---
