# GCP Secret Manager ClusterSecretStore
# Prerequisites:
# 1. Enable Secret Manager API
# 2. Create service account with roles/secretmanager.secretAccessor
# 3. Enable Workload Identity on GKE
# 4. Bind K8s SA to GCP SA
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: YOUR_PROJECT_ID  # Change this
      auth:
        workloadIdentity:
          clusterLocation: us-central1  # Change to your region
          clusterName: mantl
          clusterProjectID: YOUR_PROJECT_ID  # Change this
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
