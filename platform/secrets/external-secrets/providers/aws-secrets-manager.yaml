# AWS Secrets Manager ClusterSecretStore
# Prerequisites:
# 1. Create IAM role with SecretsManagerReadWrite policy
# 2. Enable IRSA (IAM Roles for Service Accounts) on EKS
# 3. Annotate the external-secrets service account with the role ARN
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1  # Change to your region
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
