# HashiCorp Vault ClusterSecretStore
# Prerequisites:
# 1. Deploy Vault (see platform/secrets/vault/ or use external Vault)
# 2. Enable Kubernetes auth method in Vault
# 3. Create policy and role for external-secrets
#
# Vault setup commands:
#   vault auth enable kubernetes
#   vault write auth/kubernetes/config \
#     kubernetes_host="https://$KUBERNETES_PORT_443_TCP_ADDR:443"
#   vault policy write external-secrets - <<EOF
#   path "secret/data/*" { capabilities = ["read"] }
#   EOF
#   vault write auth/kubernetes/role/external-secrets \
#     bound_service_account_names=external-secrets \
#     bound_service_account_namespaces=external-secrets \
#     policies=external-secrets \
#     ttl=1h
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: hashicorp-vault
spec:
  provider:
    vault:
      server: https://vault.vault.svc.cluster.local:8200  # Internal Vault
      # server: https://vault.example.com:8200  # External Vault
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
      # For external Vault with TLS:
      # caProvider:
      #   type: Secret
      #   name: vault-ca
      #   namespace: external-secrets
      #   key: ca.crt
---
# Example ExternalSecret usage:
# apiVersion: external-secrets.io/v1beta1
# kind: ExternalSecret
# metadata:
#   name: my-secret
# spec:
#   refreshInterval: 1h
#   secretStoreRef:
#     name: hashicorp-vault
#     kind: ClusterSecretStore
#   target:
#     name: my-k8s-secret
#   data:
#     - secretKey: password
#       remoteRef:
#         key: secret/data/myapp/database
#         property: password
