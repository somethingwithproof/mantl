apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-default-namespace
  annotations:
    policies.kyverno.io/title: "Disallow Default Namespace"
    policies.kyverno.io/category: "Best Practices"
    policies.kyverno.io/severity: "medium"
    policies.kyverno.io/subject: "Pod, Service, Deployment, StatefulSet, DaemonSet"
    policies.kyverno.io/description: |
      Workloads should not be deployed in the default namespace.
      Using the default namespace is an anti-pattern that:

      - Makes resource organization difficult
      - Prevents effective RBAC policies
      - Complicates network policies
      - Reduces visibility and accountability

      Best practice: Create dedicated namespaces per application or team.

      Compliance: CIS Kubernetes Benchmark 5.7.1
spec:
  validationFailureAction: Enforce
  background: true
  rules:
  - name: disallow-default-namespace
    match:
      any:
      - resources:
          kinds:
          - Pod
          - Deployment
          - StatefulSet
          - DaemonSet
          - Job
          - CronJob
          - Service
          - Ingress
          - ConfigMap
          - Secret
          - ServiceAccount
    validate:
      message: |
        Workloads must not be deployed in the 'default' namespace.

        Create a dedicated namespace instead:

          kubectl create namespace myapp
          kubectl apply -f deployment.yaml -n myapp

        Or specify namespace in the manifest:

          metadata:
            namespace: myapp
      deny:
        conditions:
          any:
          - key: "{{request.object.metadata.namespace || 'default'}}"
            operator: Equals
            value: default
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-namespace-purpose
  annotations:
    policies.kyverno.io/title: "Require Namespace Purpose Label"
    policies.kyverno.io/category: "Best Practices"
    policies.kyverno.io/severity: "low"
    policies.kyverno.io/subject: "Namespace"
    policies.kyverno.io/description: |
      Require that all namespaces have a 'purpose' label describing their use.
      This improves organization and accountability.
spec:
  validationFailureAction: Audit
  background: true
  rules:
  - name: check-namespace-purpose
    match:
      any:
      - resources:
          kinds:
          - Namespace
    exclude:
      any:
      - resources:
          names:
          - default
          - kube-system
          - kube-public
          - kube-node-lease
          - kyverno
          - mantl-system
    validate:
      message: |
        Namespace must have a 'purpose' label describing its use.

        Examples:
          purpose: "production-workloads"
          purpose: "development-testing"
          purpose: "monitoring-infrastructure"
          purpose: "ci-cd-pipelines"
      pattern:
        metadata:
          labels:
            purpose: "?*"
