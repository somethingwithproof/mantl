apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tetragon

resources:
  - namespace.yaml
  - policies/

helmCharts:
  - name: tetragon
    repo: https://helm.cilium.io
    version: 1.2.0
    releaseName: tetragon
    namespace: tetragon
    valuesFile: values.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: mantl-security
      app.kubernetes.io/managed-by: kustomize
