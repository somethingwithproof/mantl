# Restrict container images to approved registries
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict Image Registries
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Restrict container images to only approved registries to prevent
      running untrusted or potentially malicious images.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: validate-registries
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: >-
          Images must be from approved registries: 
          ghcr.io, gcr.io, docker.io/library, quay.io, 
          registry.k8s.io, or your private registry.
        pattern:
          spec:
            containers:
              - image: "ghcr.io/* | gcr.io/* | docker.io/library/* | quay.io/* | registry.k8s.io/* | *.dkr.ecr.*.amazonaws.com/* | harbor.example.com/*"
            =(initContainers):
              - image: "ghcr.io/* | gcr.io/* | docker.io/library/* | quay.io/* | registry.k8s.io/* | *.dkr.ecr.*.amazonaws.com/* | harbor.example.com/*"
            =(ephemeralContainers):
              - image: "ghcr.io/* | gcr.io/* | docker.io/library/* | quay.io/* | registry.k8s.io/* | *.dkr.ecr.*.amazonaws.com/* | harbor.example.com/*"
