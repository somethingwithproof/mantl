# Kyverno - CNCF Graduated
# https://kyverno.io/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kyverno

resources:
  - namespace.yaml
  # Policies
  - policies/require-labels.yaml
  - policies/restrict-registries.yaml
  - policies/verify-image-signatures.yaml

helmCharts:
  - name: kyverno
    repo: https://kyverno.github.io/kyverno/
    version: 3.3.3
    releaseName: kyverno
    namespace: kyverno
    valuesFile: values.yaml
