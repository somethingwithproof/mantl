apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-network-policy
  annotations:
    policies.kyverno.io/title: Require Network Policy
    policies.kyverno.io/category: Network Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Namespace
    policies.kyverno.io/description: 'Require that all namespaces have at least one NetworkPolicy defined.

      This enforces zero-trust networking by ensuring explicit allow rules.


      NetworkPolicies provide:

      - Microsegmentation between pods

      - Defense in depth

      - Compliance with zero-trust principles

      - Protection against lateral movement


      Compliance: CIS Kubernetes Benchmark 5.3.2, NIST 800-190

      '
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: check-network-policy-exists
      match:
        any:
          - resources:
              kinds:
                - Namespace
      exclude:
        any:
          - resources:
              names:
                - default
                - kube-system
                - kube-public
                - kube-node-lease
                - kyverno
      context:
        - name: networkPolicyCount
          apiCall:
            urlPath: /apis/networking.k8s.io/v1/namespaces/{{request.object.metadata.name}}/networkpolicies
            jmesPath: items | length(@)
      preconditions:
        any:
          - key: '{{request.operation}}'
            operator: NotEquals
            value: DELETE
      validate:
        message: "Namespace must have at least one NetworkPolicy defined.\n\nCreate a NetworkPolicy to allow traffic:\n\nExample - Default deny all ingress:\n---\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name: default-deny-ingress\nspec:\n  podSelector: {}\n  policyTypes:\n  - Ingress\n\nExample - Allow specific traffic:\n---\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name: allow-frontend-to-backend\nspec:\n  podSelector:\n    matchLabels:\n      app: backend\n  policyTypes:\n  - Ingress\n  ingress:\n  - from:\n    - podSelector:\n        matchLabels:\n          app: frontend\n    ports:\n    - protocol: TCP\n      port: 8080\n"
        deny:
          conditions:
            any:
              - key: '{{ networkPolicyCount }}'
                operator: LessThan
                value: 1
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-default-deny-network-policy
  annotations:
    policies.kyverno.io/title: Require Default Deny Network Policy
    policies.kyverno.io/category: Network Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: NetworkPolicy
    policies.kyverno.io/description: 'Require that namespaces have a default deny NetworkPolicy.

      This implements deny-by-default, allow-by-exception pattern.


      Best practice: Start with default deny, then add specific allow rules.

      '
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: check-default-deny-exists
      match:
        any:
          - resources:
              kinds:
                - Namespace
      exclude:
        any:
          - resources:
              names:
                - default
                - kube-system
                - kube-public
                - kube-node-lease
                - kyverno
      context:
        - name: defaultDenyPolicies
          apiCall:
            urlPath: /apis/networking.k8s.io/v1/namespaces/{{request.object.metadata.name}}/networkpolicies
            jmesPath: items[?spec.podSelector == `{}`] | length(@)
      preconditions:
        any:
          - key: '{{request.operation}}'
            operator: NotEquals
            value: DELETE
      validate:
        message: "Namespace should have a default deny NetworkPolicy (podSelector: {}).\n\nCreate a default deny policy:\n\n---\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name: default-deny-ingress\nspec:\n  podSelector: {}\n  policyTypes:\n  - Ingress\n\nOr for both ingress and egress:\n\n---\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name: default-deny-all\nspec:\n  podSelector: {}\n  policyTypes:\n  - Ingress\n  - Egress\n"
        deny:
          conditions:
            any:
              - key: '{{ defaultDenyPolicies }}'
                operator: LessThan
                value: 1
