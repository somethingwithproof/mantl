apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require Resource Requests and Limits
    policies.kyverno.io/category: Resource Management
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.6.0
    policies.kyverno.io/description: 'All containers must specify CPU and memory resource requests and limits.

      This ensures proper resource allocation and prevents resource exhaustion.


      Rationale: Without resource limits, a single pod can consume all node

      resources, affecting other workloads. Without requests, the scheduler

      cannot make informed placement decisions.


      Compliance: CIS Kubernetes Benchmark 5.2.1, 5.2.2

      '
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-container-resources
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - kyverno
      validate:
        message: "All containers must have CPU and memory resource requests and limits defined.\n\nMissing: {{ request.object.spec.containers[?!resources.requests.cpu || !resources.requests.memory || !resources.limits.cpu || !resources.limits.memory].name | join(', ') }}\n\nExample:\n  resources:\n    requests:\n      cpu: \"100m\"\n      memory: \"128Mi\"\n    limits:\n      cpu: \"500m\"\n      memory: \"512Mi\"\n"
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: ?*
                    memory: ?*
                  limits:
                    cpu: ?*
                    memory: ?*
    - name: check-init-container-resources
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - kyverno
      preconditions:
        any:
          - key: '{{ request.object.spec.initContainers[] || `[]` | length(@) }}'
            operator: GreaterThan
            value: 0
      validate:
        message: 'All init containers must have CPU and memory resource requests and limits defined.


          Missing: {{ request.object.spec.initContainers[?!resources.requests.cpu || !resources.requests.memory || !resources.limits.cpu || !resources.limits.memory].name | join('', '') }}

          '
        pattern:
          spec:
            initContainers:
              - resources:
                  requests:
                    cpu: ?*
                    memory: ?*
                  limits:
                    cpu: ?*
                    memory: ?*
    - name: check-ephemeral-container-resources
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - kyverno
      preconditions:
        any:
          - key: '{{ request.object.spec.ephemeralContainers[] || `[]` | length(@) }}'
            operator: GreaterThan
            value: 0
      validate:
        message: 'All ephemeral containers must have CPU and memory resource requests and limits defined.

          '
        pattern:
          spec:
            ephemeralContainers:
              - resources:
                  requests:
                    cpu: ?*
                    memory: ?*
                  limits:
                    cpu: ?*
                    memory: ?*
