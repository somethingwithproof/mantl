apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-service-account-tokens
  annotations:
    policies.kyverno.io/title: Restrict Service Account Tokens
    policies.kyverno.io/category: Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: 'Restrict automatic mounting of service account tokens unless explicitly

      needed. This reduces attack surface by limiting access to Kubernetes API.


      Default behavior: Service account tokens are auto-mounted to all pods.

      Security risk: Compromised pod can access Kubernetes API with SA permissions.


      Best practice: Disable automounting unless required, use Workload Identity.


      Compliance: CIS Kubernetes Benchmark 5.1.6

      '
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-explicit-automount-decision
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
      validate:
        message: "Service account token automounting should be explicitly configured.\n\nIf your pod DOES NOT need to access the Kubernetes API, disable it:\n\n  spec:\n    automountServiceAccountToken: false\n\nIf your pod DOES need API access, explicitly enable and document why:\n\n  spec:\n    automountServiceAccountToken: true\n    # Comment: Required for cert-manager webhook\n\nBetter yet, use Workload Identity instead of service account tokens.\n"
        anyPattern:
          - spec:
              automountServiceAccountToken: true
          - spec:
              automountServiceAccountToken: false
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-wildcard-verbs
  annotations:
    policies.kyverno.io/title: Restrict Wildcard Verbs in RBAC
    policies.kyverno.io/category: Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Role, ClusterRole
    policies.kyverno.io/description: 'Disallow use of wildcard ''*'' in RBAC policy rules.

      Wildcard permissions grant excessive access and violate least privilege.


      Bad: verbs: ["*"] grants all permissions

      Good: verbs: ["get", "list", "watch"] grants specific permissions


      Compliance: CIS Kubernetes Benchmark 5.1.3

      '
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: disallow-wildcard-verbs
      match:
        any:
          - resources:
              kinds:
                - Role
                - ClusterRole
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
          - resources:
              names:
                - cluster-admin
                - admin
      validate:
        message: "Wildcard '*' is not allowed in verbs. Specify explicit permissions.\n\nBad:\n  verbs: [\"*\"]\n\nGood:\n  verbs: [\"get\", \"list\", \"watch\", \"create\", \"update\", \"patch\", \"delete\"]\n\nOr be even more restrictive:\n  verbs: [\"get\", \"list\"]  # Read-only access\n"
        foreach:
          - list: request.object.rules[]
            deny:
              conditions:
                any:
                  - key: '{{ element.verbs[] }}'
                    operator: AnyIn
                    value:
                      - '*'
    - name: disallow-wildcard-resources
      match:
        any:
          - resources:
              kinds:
                - Role
                - ClusterRole
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
          - resources:
              names:
                - cluster-admin
                - admin
      validate:
        message: "Wildcard '*' is not allowed in resources. Specify explicit resources.\n\nBad:\n  resources: [\"*\"]\n\nGood:\n  resources: [\"pods\", \"services\", \"deployments\"]\n"
        foreach:
          - list: request.object.rules[]
            deny:
              conditions:
                any:
                  - key: '{{ element.resources[] }}'
                    operator: AnyIn
                    value:
                      - '*'
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-bind-escalate
  annotations:
    policies.kyverno.io/title: Restrict Bind and Escalate Verbs
    policies.kyverno.io/category: Security
    policies.kyverno.io/severity: critical
    policies.kyverno.io/subject: Role, ClusterRole
    policies.kyverno.io/description: 'Restrict the use of ''bind'' and ''escalate'' verbs in RBAC roles.

      These verbs allow privilege escalation attacks.


      - bind: Allows binding to roles with more permissions

      - escalate: Allows creating roles with more permissions


      These should only be granted to cluster administrators.


      Compliance: CIS Kubernetes Benchmark 5.1.1

      '
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: disallow-bind-escalate
      match:
        any:
          - resources:
              kinds:
                - Role
                - ClusterRole
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
          - resources:
              names:
                - cluster-admin
      validate:
        message: "The 'bind' and 'escalate' verbs are not allowed as they enable\nprivilege escalation. Only cluster administrators should have these.\n\nBlocked verbs: bind, escalate\n\nIf you need to manage roles, use specific permissions:\n  verbs: [\"get\", \"list\", \"watch\"]\n"
        foreach:
          - list: request.object.rules[]
            deny:
              conditions:
                any:
                  - key: '{{ element.verbs[] }}'
                    operator: AnyIn
                    value:
                      - bind
                      - escalate
