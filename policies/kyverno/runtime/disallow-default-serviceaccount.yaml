apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-default-serviceaccount
  annotations:
    policies.kyverno.io/title: Disallow Default ServiceAccount
    policies.kyverno.io/category: SOC2
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.6.0
    policies.kyverno.io/description: 'Pods must run under an explicit, dedicated ServiceAccount rather than the

      namespace ''default''. The default account is shared and makes per-workload

      authorization and audit impossible.


      The serviceAccountName field is required (no conditional anchor) so an unset

      value, which the API server resolves to ''default'', is also rejected.


      Compliance: SOC2 CC6.2 (least privilege).

      '
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: disallow-default-sa
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - kyverno
      validate:
        message: Pods must set an explicit ServiceAccount other than 'default'.
        pattern:
          spec:
            serviceAccountName: '!default'
