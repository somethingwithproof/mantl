apiVersion: kyverno.io/v2beta1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
  annotations:
    policies.kyverno.io/title: Verify Image Signatures (Cosign)
    policies.kyverno.io/description: >-
      Require container images to be signed by Cosign for approved registries. Start in Audit, then Enforce.
spec:
  validationFailureAction: Enforce
  background: true
  exclude:
    any:
      - resources:
          namespaces:
            - kube-system
            - kube-public
            - kube-node-lease
            - cert-manager
            - external-dns
            - argocd
            - kyverno
  rules:
    - name: verify-cosign-ghcr-keyless
      match:
        any:
          - resources:
              kinds: [Pod]
      verifyImages:
        - imageReferences:
            - "ghcr.io/*/*"
          attestors:
            - entries:
                - keyless:
                    subject: "https://github.com/{{repo_owner}}/{{repo_name}}/*"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: "https://rekor.sigstore.dev"
          # For key-based verification, create a secret with your public key:
          # kubectl create secret generic cosign-key --from-file=cosign.pub -n kyverno
          # Then uncomment and use:
          # - entries:
          #     - keys:
          #         publicKeys: |-
          #           -----BEGIN PUBLIC KEY-----
          #           Your actual Cosign public key here
          #           -----END PUBLIC KEY-----
          #         secret:
          #           name: cosign-key
          #           namespace: kyverno
