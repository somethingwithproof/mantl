apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: stig-disallow-secret-env
  annotations:
    pod-policies.kyverno.io/autogen-controllers: none
    policies.kyverno.io/category: DISA Kubernetes STIG
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: stig-disallow-secret-env
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: Mount secrets as files; do not expose Secret references through environment variables.
        foreach:
          - list: request.object.spec.[containers, initContainers, ephemeralContainers][]
            deny:
              conditions:
                any:
                  - key: '{{ length(element.env[?valueFrom.secretKeyRef] || `[]`) }}'
                    operator: GreaterThan
                    value: 0
                  - key: '{{ length(element.envFrom[?secretRef] || `[]`) }}'
                    operator: GreaterThan
                    value: 0
